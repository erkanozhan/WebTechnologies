<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tıklama Sayacı</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="sayac-karti">
    <h1>Tıklama Sayacı</h1>
    <p id="deger" class="deger" aria-live="polite">0</p>
    <div class="dugmeler">
      <button type="button" id="azalt" aria-label="Bir azalt">−</button>
      <button type="button" id="sifirla" class="ikincil">Sıfırla</button>
      <button type="button" id="artir" aria-label="Bir artır">+</button>
    </div>
    <p class="ipucu">10 ve üzerinde sayı yeşile döner; sayı 0'ın altına inmez.</p>
  </main>
</body>
</html>
