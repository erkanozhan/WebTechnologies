<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalden Alınması Gereken Not</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Finalden Alınması Gereken Not</h1>
    <p>Geçme kuralı: ağırlıklı ortalama en az 60.</p>

    <form id="hedefFormu" novalidate>
      <fieldset>
        <legend>Ödev var mı?</legend>
        <label><input type="radio" name="odevVar" value="evet" checked> Var</label>
        <label><input type="radio" name="odevVar" value="hayir"> Yok</label>
      </fieldset>

      <div class="izgara">
        <label for="vize">Vize notu</label>
        <input type="number" id="vize" name="vize" min="0" max="100" step="0.01" required value="45">

        <label for="vizeOrani">Vize oranı (%)</label>
        <input type="number" id="vizeOrani" name="vizeOrani" min="0" max="100" value="30" required>

        <label for="odev">Ödev notu</label>
        <input type="number" id="odev" name="odev" min="0" max="100" step="0.01" required value="80">

        <label for="odevOrani">Ödev oranı (%)</label>
        <input type="number" id="odevOrani" name="odevOrani" min="0" max="100" value="10" required>

        <label for="finalOrani">Final oranı (%)</label>
        <input type="number" id="finalOrani" name="finalOrani" min="0" max="100" value="60" required>
      </div>

      <button type="submit">Hesapla</button>
    </form>

    <p class="sonuc">Finalden en az <output id="sonuc" for="vize odev vizeOrani odevOrani finalOrani">—</output> almalısınız.</p>
    <p id="hata" class="hata" role="alert"></p>
  </main>
</body>
</html>
