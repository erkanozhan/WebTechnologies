<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Örnek 5.5 – Arka Plan Özellikleri</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Arka plan görseli: tekrar, konum ve boyut</h1>
  <div class="izgara">
    <figure><div class="kutu repeat"></div><figcaption>repeat (varsayılan)</figcaption></figure>
    <figure><div class="kutu repeat-x"></div><figcaption>repeat-x</figcaption></figure>
    <figure><div class="kutu no-repeat"></div><figcaption>no-repeat + right bottom</figcaption></figure>
    <figure><div class="kutu space"></div><figcaption>space</figcaption></figure>
    <figure><div class="kutu round"></div><figcaption>round</figcaption></figure>
    <figure><div class="kutu oto"></div><figcaption>size: auto (doğal boyut)</figcaption></figure>
    <figure><div class="kutu cover"></div><figcaption>size: cover</figcaption></figure>
    <figure><div class="kutu contain"></div><figcaption>size: contain</figcaption></figure>
  </div>
</body>
</html>
