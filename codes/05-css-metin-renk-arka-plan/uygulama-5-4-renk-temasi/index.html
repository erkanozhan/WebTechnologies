<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Değişkenleriyle Renk Teması</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="yan-yana">
    <section class="ekran">
      <p class="etiket">Açık tema</p>
      <div class="kart">
        <p class="hesap">Vadesiz Hesap</p>
        <p class="bakiye">12.450,75 TL</p>
        <p class="aciklama">Son işlem: Market alışverişi – 245,90 TL</p>
        <div class="islemler">
          <a class="dugme" href="#">Para gönder</a>
          <a class="dugme ikincil" href="#">Fatura öde</a>
        </div>
      </div>
    </section>
    <section class="ekran koyu">
      <p class="etiket">Koyu tema</p>
      <div class="kart">
        <p class="hesap">Vadesiz Hesap</p>
        <p class="bakiye">12.450,75 TL</p>
        <p class="aciklama">Son işlem: Market alışverişi – 245,90 TL</p>
        <div class="islemler">
          <a class="dugme" href="#">Para gönder</a>
          <a class="dugme ikincil" href="#">Fatura öde</a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
