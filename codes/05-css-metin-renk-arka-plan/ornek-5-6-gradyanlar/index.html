<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Örnek 5.6 – Gradyanlar ve Çoklu Arka Plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS gradyanları</h1>
  <div class="izgara">
    <figure><div class="kutu g1"></div><figcaption>linear-gradient(to bottom, #ffff00, #00ff00)</figcaption></figure>
    <figure><div class="kutu g2"></div><figcaption>linear-gradient(135deg, #1f6feb, #8250df)</figcaption></figure>
    <figure><div class="kutu g3"></div><figcaption>linear-gradient(to right, #cf222e 0 33%, #ffffff 33% 66%, #2da44e 66%)</figcaption></figure>
    <figure><div class="kutu g4"></div><figcaption>radial-gradient(circle at 30% 30%, #ffffff, #1f6feb)</figcaption></figure>
    <figure><div class="kutu g5"></div><figcaption>conic-gradient(#cf222e 0 25%, #bf8700 0 50%, #2da44e 0 75%, #1f6feb 0)</figcaption></figure>
    <figure><div class="kutu g6"></div><figcaption>repeating-linear-gradient(45deg, …)</figcaption></figure>
  </div>
  <h2>Çoklu arka plan: gradyan katmanı + desen + renk</h2>
  <div class="katmanli">
    <p>İlk yazılan katman en üstte görünür.</p>
  </div>
</body>
</html>
