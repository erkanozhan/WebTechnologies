<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uygulama 6.2 – Kenarlık Stilleri Galerisi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>border-style değerleri</h1>
  <section class="galeri">
    <div class="kutu none"><code>none</code><span>kenarlık yok</span></div>
    <div class="kutu dotted"><code>dotted</code><span>noktalı</span></div>
    <div class="kutu dashed"><code>dashed</code><span>kesikli</span></div>
    <div class="kutu solid"><code>solid</code><span>düz</span></div>
    <div class="kutu double"><code>double</code><span>çift çizgi</span></div>
    <div class="kutu groove"><code>groove</code><span>oluklu</span></div>
    <div class="kutu ridge"><code>ridge</code><span>çıkıntılı</span></div>
    <div class="kutu inset"><code>inset</code><span>içe basık</span></div>
    <div class="kutu outset"><code>outset</code><span>dışa kabarık</span></div>
  </section>

  <section class="ozel">
    <div id="dort-stil">dört farklı stil</div>
    <div id="dort-kalinlik">dört farklı kalınlık</div>
    <div id="dort-renk">dört farklı renk</div>
  </section>
</body>
</html>
