<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Örnek 6.3 – border-radius ile köşe yuvarlatma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="galeri">
    <figure><div class="sekil r1"></div><figcaption>border-top-right-radius: 50px</figcaption></figure>
    <figure><div class="sekil r2"></div><figcaption>border-radius: 1em 2em</figcaption></figure>
    <figure><div class="sekil r3"></div><figcaption>border-radius: 5px 20px / 40px 60px</figcaption></figure>
    <figure><div class="sekil r4"></div><figcaption>border-radius: 1em</figcaption></figure>
    <figure><div class="sekil r5"></div><figcaption>border-radius: 50px (hap)</figcaption></figure>
    <figure><div class="sekil r6"></div><figcaption>border-radius: 36px 40px 60px 20px</figcaption></figure>
    <figure><div class="sekil kare r7"></div><figcaption>border-radius: 50% (daire)</figcaption></figure>
    <figure><div class="sekil r8"></div><figcaption>border-radius: 50% (elips)</figcaption></figure>
  </div>
</body>
</html>
