<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Uygulama 6.1 – Kutu Modeli Hesaplama</title>

<body>
  <main>
    <div class="duyuru" id="duyuru">
      <strong>OBS Duyurusu</strong>
      <p>Ders kayıt yenileme işlemleri 10–14 Şubat tarihleri arasında yapılacaktır.</p>
    </div>

    <table>
      <caption>Hesaplama (content-box)</caption>
      <thead>
        <tr><th>Katman</th><th>Yatay toplam</th></tr>
      </thead>
      <tbody>
        <tr><td>İçerik (width)</td><td>260 px</td></tr>
        <tr><td>Dolgu (2 × 16)</td><td>32 px</td></tr>
        <tr><td>Kenarlık (2 × 4)</td><td>8 px</td></tr>
        <tr class="ara"><td>Görünen genişlik</td><td>300 px</td></tr>
        <tr><td>Kenar boşluğu (2 × 24)</td><td>48 px</td></tr>
        <tr class="ara"><td>Kapladığı yatay alan</td><td>348 px</td></tr>
      </tbody>
    </table>
  </main>
