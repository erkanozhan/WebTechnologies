<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uygulama 3.6 - İletişim Formu</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Bölüm Sekreterliği İletişim Formu</h1>
    <p class="aciklama"><span aria-hidden="true">*</span> işaretli alanların doldurulması zorunludur.</p>

    <!-- Gerçek uygulamada action, HTTPS üzerindeki sunucu programının adresi olur. -->
    <form action="#" method="post">
      <fieldset>
        <legend>Kişisel bilgiler</legend>

        <div class="alan">
          <label for="adsoyad">Ad soyad *</label>
          <input type="text" id="adsoyad" name="adsoyad"
                 required minlength="3" maxlength="60" autocomplete="name">
        </div>

        <div class="alan">
          <label for="eposta">E-posta *</label>
          <input type="email" id="eposta" name="eposta"
                 required autocomplete="email" aria-describedby="eposta-ipucu">
          <small id="eposta-ipucu">Örnek biçim: ad.soyad@ornek.edu.tr</small>
        </div>

        <div class="alan">
          <label for="telefon">Cep telefonu</label>
          <input type="tel" id="telefon" name="telefon"
                 pattern="05[0-9]{9}" autocomplete="tel" aria-describedby="telefon-ipucu">
          <small id="telefon-ipucu">05 ile başlayan 11 hane, boşluksuz (05xxxxxxxxx)</small>
        </div>
      </fieldset>

      <fieldset>
        <legend>Mesaj</legend>

        <div class="alan">
          <label for="konu">Konu *</label>
          <select id="konu" name="konu" required>
            <option value="">Seçiniz</option>
            <option value="kayit">Kayıt ve ders seçimi</option>
            <option value="staj">Staj</option>
            <option value="sinav">Sınavlar</option>
            <option value="diger">Diğer</option>
          </select>
        </div>

        <div class="alan">
          <label for="mesaj">Mesajınız *</label>
          <textarea id="mesaj" name="mesaj" rows="5"
                    required minlength="20" maxlength="500"
                    aria-describedby="mesaj-ipucu"></textarea>
          <small id="mesaj-ipucu">En az 20, en çok 500 karakter.</small>
        </div>

        <div class="alan onay">
          <input type="checkbox" id="kvkk" name="kvkk" value="onay" required>
          <label for="kvkk">Kişisel verilerimin bu başvuru kapsamında işlenmesini kabul ediyorum. *</label>
        </div>
      </fieldset>

      <div class="dugmeler">
        <button type="submit">Gönder</button>
        <button type="reset">Temizle</button>
      </div>
    </form>

    <p id="durum" role="status"></p>
  </main>
</body>
</html>
