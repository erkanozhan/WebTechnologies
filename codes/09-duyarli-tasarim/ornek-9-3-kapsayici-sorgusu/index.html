<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Örnek 9.3 – Kapsayıcı Sorgusu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="duzen">
    <main class="kap">
      <h2>Ana sütun (geniş kapsayıcı)</h2>
      <article class="haber">
          <img src="kucuk.svg" alt="Durakta bekleyen kırmızı ring otobüsü çizimi" width="160" height="120">
          <div>
            <h3>Kampüs ring seferleri artırıldı</h3>
            <p>Hafta içi sabah saatlerinde iki ek sefer eklendi.</p>
          </div>
        </article>
    </main>
    <aside class="kap">
      <h2>Yan sütun (dar kapsayıcı)</h2>
      <article class="haber">
          <img src="kucuk.svg" alt="Durakta bekleyen kırmızı ring otobüsü çizimi" width="160" height="120">
          <div>
            <h3>Kampüs ring seferleri artırıldı</h3>
            <p>Hafta içi sabah saatlerinde iki ek sefer eklendi.</p>
          </div>
        </article>
    </aside>
  </div>
</body>
</html>
