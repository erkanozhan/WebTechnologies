<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merhaba Web</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Merhaba Web!</h1>
    <p>Bu sayfa bir metin dosyasından ibarettir; tarayıcı onu okuyup ekrana çizer. Aşağıdaki tablo, sayfanın <strong>nasıl açıldığını</strong> gösterir.</p>

    <table>
      <caption>Bu sayfanın adresi</caption>
      <tbody>
        <tr>
          <th scope="row">Tam adres</th>
          <td id="tam-adres">-</td>
        </tr>
        <tr>
          <th scope="row">Şema</th>
          <td id="sema">-</td>
        </tr>
        <tr>
          <th scope="row">Ana makine</th>
          <td id="ana-makine">-</td>
        </tr>
        <tr>
          <th scope="row">Bağlantı noktası</th>
          <td id="port">-</td>
        </tr>
        <tr>
          <th scope="row">Yol</th>
          <td id="yol">-</td>
        </tr>
      </tbody>
    </table>

    <p id="yorum" class="yorum"></p>
  </main>
</body>
</html>
