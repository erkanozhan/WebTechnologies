<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün Kartları: Sınıf ve Kimlik Seçicileri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Kampüs Kırtasiye: Haftanın Ürünleri</h1>
    <div class="vitrin">
      <article class="urun-kart">
        <img class="urun-kart__gorsel" src="defter.svg" alt="Spiralli defter" width="120" height="120">
        <h2 class="urun-kart__baslik">Spiralli Defter</h2>
        <p class="urun-kart__fiyat">89,90 TL</p>
        <a class="urun-kart__dugme" href="#">Sepete ekle</a>
      </article>

      <article class="urun-kart" id="gunun-firsati">
        <img class="urun-kart__gorsel" src="kulaklik.svg" alt="Kablosuz kulaklık" width="120" height="120">
        <h2 class="urun-kart__baslik">Kablosuz Kulaklık</h2>
        <p class="urun-kart__fiyat urun-kart__fiyat--indirimli"><del>1.199 TL</del> 899 TL</p>
        <a class="urun-kart__dugme" href="#">Sepete ekle</a>
      </article>

      <article class="urun-kart">
        <img class="urun-kart__gorsel" src="termos.svg" alt="Çelik termos" width="120" height="120">
        <h2 class="urun-kart__baslik">Çelik Termos</h2>
        <p class="urun-kart__fiyat">349 TL</p>
        <a class="urun-kart__dugme" href="#">Sepete ekle</a>
      </article>
    </div>
  </main>
</body>
</html>
