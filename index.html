<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Web Teknolojileri Ders Notları</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="docsify-stil.css">
</head>
<body>
  <div id="app">Yükleniyor...</div>

  <!-- Ortak ayarlar: kenar çubuğu, arama, uyarı kutuları, ```mermaid blokları, bağlantı düzeltmeleri -->
  <script src="docsify-ayar.js"></script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Mermaid - Diyagramlar için -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      deterministicIds: true,   // aynı sayfadaki diyagramların kimlikleri çakışmasın
      theme: 'default',
      securityLevel: 'loose',
      flowchart: { useMaxWidth: true, htmlLabels: true }
    });
  </script>

  <!-- Kod renklendirme (HTML, CSS ve JavaScript docsify'da hazır gelir) -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>

  <!-- Arama (tüm bölümlerde) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Kod kopyalama düğmesi -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
</body>
</html>
