<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="baslik aciklama">
  <title id="baslik">Sunucu taraflı ve istemci taraflı betiğin çalıştığı yerler</title>
  <desc id="aciklama">Tarayıcı bakiye sayfasını ister; web sunucusundaki betik motoru sunucu taraflı betiği çalıştırır, veritabanını sorgular ve yalnızca üretilen HTML veya JSON çıktısını tarayıcıya döndürür. Tarayıcıdaki JavaScript ise gelen sayfa üzerinde çalışır.</desc>
  <defs>
    <marker id="okK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="okM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
    <marker id="okG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Tarayıcı -->
  <rect x="20" y="40" width="230" height="200" rx="10" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2"/>
  <text x="135" y="68" font-size="16" font-weight="700" text-anchor="middle" fill="#1f6feb">Web tarayıcısı</text>
  <text x="135" y="88" font-size="13" text-anchor="middle" fill="#57606a">istemci katmanı</text>
  <rect x="38" y="102" width="194" height="66" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="50" y="126" font-size="13" fill="#24292f">JavaScript motoru</text>
  <text x="50" y="146" font-size="12" font-family="Consolas, monospace" fill="#57606a">tutarı biçimlendir,</text>
  <text x="50" y="159" font-size="12" font-family="Consolas, monospace" fill="#57606a">formu denetle</text>
  <text x="135" y="190" font-size="13" text-anchor="middle" fill="#24292f">Kullanıcı yalnızca HTML,</text>
  <text x="135" y="208" font-size="13" text-anchor="middle" fill="#24292f">CSS, JS ve veriyi görür;</text>
  <text x="135" y="226" font-size="13" text-anchor="middle" fill="#24292f">sunucu kodunu görmez.</text>

  <!-- Web sunucusu -->
  <rect x="360" y="40" width="270" height="200" rx="10" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="495" y="68" font-size="16" font-weight="700" text-anchor="middle" fill="#9a6700">Web sunucusu</text>
  <text x="495" y="88" font-size="13" text-anchor="middle" fill="#57606a">işlem katmanı</text>
  <rect x="380" y="102" width="230" height="66" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="392" y="126" font-size="13" fill="#24292f">Betik motoru (PHP, Python, Node.js …)</text>
  <text x="392" y="146" font-size="12" font-family="Consolas, monospace" fill="#57606a">oturumu doğrula, bakiyeyi</text>
  <text x="392" y="159" font-size="12" font-family="Consolas, monospace" fill="#57606a">sorgula, HTML/JSON üret</text>
  <text x="495" y="200" font-size="13" text-anchor="middle" fill="#24292f">Sunucu taraflı betik</text>
  <text x="495" y="218" font-size="13" text-anchor="middle" fill="#24292f">yalnızca burada çalışır.</text>

  <!-- Veritabanı -->
  <g fill="#2da44e" stroke="#1a7f37" stroke-width="2">
    <path d="M740,80 L740,190 A60,16 0 0 0 860,190 L860,80"/>
    <ellipse cx="800" cy="80" rx="60" ry="16"/>
  </g>
  <text x="800" y="140" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Veritabanı</text>
  <text x="800" y="228" font-size="13" text-anchor="middle" fill="#57606a">veri depolama katmanı</text>

  <!-- Oklar -->
  <line x1="255" y1="110" x2="352" y2="110" stroke="#cf222e" stroke-width="4" marker-end="url(#okK)"/>
  <text x="304" y="100" font-size="13" font-weight="600" text-anchor="middle" fill="#cf222e">1 İstek</text>
  <line x1="636" y1="135" x2="732" y2="135" stroke="#57606a" stroke-width="4" marker-start="url(#okG)" marker-end="url(#okG)"/>
  <text x="684" y="124" font-size="13" font-weight="600" text-anchor="middle" fill="#57606a">2 Sorgu</text>
  <line x1="352" y1="170" x2="258" y2="170" stroke="#1f6feb" stroke-width="4" marker-end="url(#okM)"/>
  <text x="304" y="192" font-size="13" font-weight="600" text-anchor="middle" fill="#1f6feb">3 Yanıt</text>

  <text x="450" y="280" font-size="14" text-anchor="middle" fill="#24292f">1 Tarayıcı bakiye sayfasını ister.  2 Sunucu betiği veritabanını sorgular.</text>
  <text x="450" y="302" font-size="14" text-anchor="middle" fill="#24292f">3 Yalnızca üretilen çıktı döner.  4 Tarayıcıdaki JavaScript bu çıktı üzerinde çalışır.</text>
</svg>
