<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="baslik aciklama">
  <title id="baslik">İki katmanlı istemci–sunucu sistemi</title>
  <desc id="aciklama">Solda istemci (web tarayıcısı çalışan dizüstü bilgisayar), sağda sunucu; istemciden sunucuya HTTP isteği, sunucudan istemciye HTTP yanıtı gider.</desc>
  <defs>
    <marker id="okKirmizi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="okMavi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- İstemci: dizüstü bilgisayar -->
  <rect x="50" y="60" width="180" height="120" rx="8" fill="#24292f"/>
  <rect x="60" y="70" width="160" height="100" fill="#f6f8fa"/>
  <rect x="60" y="70" width="160" height="16" fill="#d0d7de"/>
  <circle cx="69" cy="78" r="3" fill="#cf222e"/>
  <circle cx="79" cy="78" r="3" fill="#bf8700"/>
  <circle cx="89" cy="78" r="3" fill="#2da44e"/>
  <rect x="98" y="73" width="112" height="10" rx="5" fill="#ffffff"/>
  <rect x="70" y="95" width="90" height="10" fill="#1f6feb"/>
  <rect x="70" y="112" width="140" height="6" fill="#8c959f"/>
  <rect x="70" y="124" width="120" height="6" fill="#8c959f"/>
  <rect x="70" y="140" width="56" height="18" rx="4" fill="#2da44e"/>
  <path d="M30,180 L250,180 L235,198 L45,198 z" fill="#57606a"/>
  <text x="140" y="228" font-size="16" font-weight="700" text-anchor="middle" fill="#24292f">İstemci (client)</text>
  <text x="140" y="250" font-size="14" text-anchor="middle" fill="#57606a">ön uç (front-end)</text>
  <text x="140" y="272" font-size="14" text-anchor="middle" fill="#57606a">Web tarayıcısı: arayüzü sunar,</text>
  <text x="140" y="291" font-size="14" text-anchor="middle" fill="#57606a">veri toplar, yanıtı biçimlendirir</text>

  <!-- Sunucu -->
  <rect x="570" y="40" width="140" height="160" rx="6" fill="#24292f"/>
  <g fill="#57606a">
    <rect x="582" y="54" width="116" height="26" rx="3"/>
    <rect x="582" y="88" width="116" height="26" rx="3"/>
    <rect x="582" y="122" width="116" height="26" rx="3"/>
    <rect x="582" y="156" width="116" height="26" rx="3"/>
  </g>
  <g fill="#2da44e">
    <circle cx="594" cy="67" r="4"/>
    <circle cx="594" cy="101" r="4"/>
    <circle cx="594" cy="135" r="4"/>
    <circle cx="594" cy="169" r="4"/>
  </g>
  <g stroke="#8c959f" stroke-width="2">
    <line x1="640" y1="67" x2="690" y2="67"/>
    <line x1="640" y1="101" x2="690" y2="101"/>
    <line x1="640" y1="135" x2="690" y2="135"/>
    <line x1="640" y1="169" x2="690" y2="169"/>
  </g>
  <text x="640" y="228" font-size="16" font-weight="700" text-anchor="middle" fill="#24292f">Sunucu (server)</text>
  <text x="640" y="250" font-size="14" text-anchor="middle" fill="#57606a">arka uç (back-end)</text>
  <text x="640" y="272" font-size="14" text-anchor="middle" fill="#57606a">Belgeleri ve verileri depolar,</text>
  <text x="640" y="291" font-size="14" text-anchor="middle" fill="#57606a">istekleri işler, yanıt döndürür</text>

  <!-- Oklar -->
  <line x1="275" y1="95" x2="540" y2="95" stroke="#cf222e" stroke-width="5" marker-end="url(#okKirmizi)"/>
  <text x="405" y="82" font-size="15" font-weight="600" text-anchor="middle" fill="#cf222e">İstek (HTTP request)</text>
  <line x1="540" y1="145" x2="275" y2="145" stroke="#1f6feb" stroke-width="5" marker-end="url(#okMavi)"/>
  <text x="405" y="172" font-size="15" font-weight="600" text-anchor="middle" fill="#1f6feb">Yanıt (HTTP response)</text>
  <text x="405" y="192" font-size="13" text-anchor="middle" fill="#57606a">HTML, CSS, JavaScript, JSON, görseller</text>
</svg>
