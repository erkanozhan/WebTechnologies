<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="t d">
  <title id="t">Visual Studio Code arayüzünün bölümleri</title>
  <desc id="d">Şematik VS Code penceresi: solda etkinlik çubuğu ve gezgin, ortada düzenleyicide index.html, altta UTF-8 ve Go Live düğmesini içeren durum çubuğu; numaralı açıklamalar sağda.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Pencere -->
    <rect x="20" y="20" width="680" height="470" rx="6" fill="#1e1e1e" stroke="#57606a"/>
    <rect x="20" y="20" width="680" height="32" rx="6" fill="#3c3c3c"/>
    <circle cx="40" cy="36" r="6" fill="#cf222e"/>
    <circle cx="60" cy="36" r="6" fill="#bf8700"/>
    <circle cx="80" cy="36" r="6" fill="#2da44e"/>
    <text x="360" y="41" font-size="13" fill="#e6e6e6" text-anchor="middle">index.html — bolum-02 — Visual Studio Code</text>

    <!-- Etkinlik çubuğu -->
    <rect x="20" y="52" width="48" height="406" fill="#333333"/>
    <!-- Gezgin simgesi -->
    <rect x="33" y="68" width="16" height="20" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="38" y="64" width="16" height="20" fill="#333333" stroke="#ffffff" stroke-width="2"/>
    <!-- Arama simgesi -->
    <circle cx="42" cy="116" r="8" fill="none" stroke="#9da5b4" stroke-width="2"/>
    <line x1="48" y1="122" x2="55" y2="129" stroke="#9da5b4" stroke-width="2"/>
    <!-- Eklentiler simgesi -->
    <rect x="32" y="158" width="9" height="9" fill="none" stroke="#9da5b4" stroke-width="2"/>
    <rect x="44" y="158" width="9" height="9" fill="none" stroke="#9da5b4" stroke-width="2"/>
    <rect x="32" y="170" width="9" height="9" fill="none" stroke="#9da5b4" stroke-width="2"/>
    <rect x="47" y="151" width="9" height="9" fill="none" stroke="#9da5b4" stroke-width="2" transform="rotate(15 51 155)"/>

    <!-- Gezgin paneli -->
    <rect x="68" y="52" width="190" height="406" fill="#252526"/>
    <text x="80" y="76" font-size="13" fill="#cccccc">GEZGİN (EXPLORER)</text>
    <text x="80" y="104" font-size="13" fill="#ffffff" font-weight="600">⌄ BOLUM-02</text>
    <text x="96" y="128" font-size="13" fill="#cccccc">› images</text>
    <rect x="70" y="138" width="186" height="22" fill="#37373d"/>
    <text x="96" y="154" font-size="13" fill="#e8ab53">&lt;&gt;</text>
    <text x="118" y="154" font-size="13" fill="#ffffff">index.html</text>
    <text x="96" y="180" font-size="13" fill="#e8ab53">&lt;&gt;</text>
    <text x="118" y="180" font-size="13" fill="#cccccc">hakkimizda.html</text>

    <!-- Düzenleyici -->
    <rect x="258" y="52" width="442" height="32" fill="#2d2d2d"/>
    <rect x="258" y="52" width="130" height="32" fill="#1e1e1e"/>
    <text x="272" y="73" font-size="13" fill="#e8ab53">&lt;&gt;</text>
    <text x="294" y="73" font-size="13" fill="#ffffff">index.html</text>
    <g font-family="Consolas, Courier New, monospace" font-size="14">
      <text x="270" y="112" fill="#858585">1</text><text x="300" y="112" fill="#808080">&lt;!<tspan fill="#569cd6">DOCTYPE</tspan> <tspan fill="#9cdcfe">html</tspan>&gt;</text>
      <text x="270" y="134" fill="#858585">2</text><text x="300" y="134" fill="#808080">&lt;<tspan fill="#569cd6">html</tspan> <tspan fill="#9cdcfe">lang</tspan>=<tspan fill="#ce9178">"tr"</tspan>&gt;</text>
      <text x="270" y="156" fill="#858585">3</text><text x="300" y="156" fill="#808080">&lt;<tspan fill="#569cd6">head</tspan>&gt;</text>
      <text x="270" y="178" fill="#858585">4</text><text x="318" y="178" fill="#808080">&lt;<tspan fill="#569cd6">meta</tspan> <tspan fill="#9cdcfe">charset</tspan>=<tspan fill="#ce9178">"UTF-8"</tspan>&gt;</text>
      <text x="270" y="200" fill="#858585">5</text><text x="318" y="200" fill="#808080">&lt;<tspan fill="#569cd6">title</tspan>&gt;<tspan fill="#d4d4d4">İlk Sayfam</tspan>&lt;/<tspan fill="#569cd6">title</tspan>&gt;</text>
      <text x="270" y="222" fill="#858585">6</text><text x="300" y="222" fill="#808080">&lt;/<tspan fill="#569cd6">head</tspan>&gt;</text>
      <text x="270" y="244" fill="#858585">7</text><text x="300" y="244" fill="#808080">&lt;<tspan fill="#569cd6">body</tspan>&gt;</text>
      <text x="270" y="266" fill="#858585">8</text><text x="318" y="266" fill="#808080">&lt;<tspan fill="#569cd6">h1</tspan>&gt;<tspan fill="#d4d4d4">Merhaba Web!</tspan>&lt;/<tspan fill="#569cd6">h1</tspan>&gt;</text>
      <text x="270" y="288" fill="#858585">9</text><text x="300" y="288" fill="#808080">&lt;/<tspan fill="#569cd6">body</tspan>&gt;</text>
      <text x="264" y="310" fill="#858585">10</text><text x="300" y="310" fill="#808080">&lt;/<tspan fill="#569cd6">html</tspan>&gt;</text>
    </g>

    <!-- Durum çubuğu -->
    <rect x="20" y="458" width="680" height="32" fill="#007acc"/>
    <text x="32" y="479" font-size="13" fill="#ffffff">Ln 8, Col 21</text>
    <text x="410" y="479" font-size="13" fill="#ffffff">UTF-8</text>
    <text x="470" y="479" font-size="13" fill="#ffffff">CRLF</text>
    <text x="520" y="479" font-size="13" fill="#ffffff">HTML</text>
    <text x="590" y="479" font-size="13" fill="#ffffff" font-weight="600">((·)) Go Live</text>

    <!-- Numaralı işaretler -->
    <g font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">
      <circle cx="236" cy="71" r="11" fill="#bf8700"/><text x="236" y="76">1</text>
      <circle cx="74" cy="166" r="11" fill="#bf8700"/><text x="74" y="171">2</text>
      <circle cx="186" cy="99" r="11" fill="#bf8700"/><text x="186" y="104">3</text>
      <circle cx="404" cy="68" r="11" fill="#bf8700"/><text x="404" y="73">4</text>
      <circle cx="430" cy="446" r="11" fill="#bf8700"/><text x="430" y="451">5</text>
      <circle cx="640" cy="446" r="11" fill="#bf8700"/><text x="640" y="451">6</text>
    </g>

    <!-- Açıklamalar -->
    <g font-size="14" fill="#1f2328">
      <text x="720" y="70" font-weight="700" font-size="15">Arayüzün bölümleri</text>
      <circle cx="731" cy="101" r="10" fill="#bf8700"/><text x="731" y="106" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>
      <text x="750" y="106">Gezgin (Explorer)</text>
      <text x="750" y="124" fill="#57606a" font-size="13">Açık klasördeki dosyalar</text>
      <circle cx="731" cy="157" r="10" fill="#bf8700"/><text x="731" y="162" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>
      <text x="750" y="162">Eklentiler (Extensions)</text>
      <text x="750" y="180" fill="#57606a" font-size="13">Live Server, Prettier kurulur</text>
      <circle cx="731" cy="213" r="10" fill="#bf8700"/><text x="731" y="218" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>
      <text x="750" y="218">Proje klasörü</text>
      <text x="750" y="236" fill="#57606a" font-size="13">File › Open Folder ile açılır</text>
      <circle cx="731" cy="269" r="10" fill="#bf8700"/><text x="731" y="274" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4</text>
      <text x="750" y="274">Düzenleyici (Editor)</text>
      <text x="750" y="292" fill="#57606a" font-size="13">Sekmeler ve kod alanı</text>
      <circle cx="731" cy="325" r="10" fill="#bf8700"/><text x="731" y="330" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>
      <text x="750" y="330">Karakter kodlaması</text>
      <text x="750" y="348" fill="#57606a" font-size="13">UTF-8 görünmelidir</text>
      <circle cx="731" cy="381" r="10" fill="#bf8700"/><text x="731" y="386" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6</text>
      <text x="750" y="386">Go Live</text>
      <text x="750" y="404" fill="#57606a" font-size="13">Live Server ile tarayıcıda açar</text>
    </g>
  </g>
</svg>
