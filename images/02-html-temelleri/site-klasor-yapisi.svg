<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" role="img" aria-labelledby="t d">
  <title id="t">Site klasör yapısı ve göreli yollar</title>
  <desc id="d">kucuk-site klasöründe index.html, hakkimizda.html, images/logo.svg, dosyalar/ders-plani.txt, dersler/index.html ve dersler/web/html-notlari.html bulunur. Mavi ok index.html'den html-notlari.html'ye iki alt klasör iner; turuncu ok html-notlari.html'den ../../index.html ile iki üst klasöre çıkar; yeşil ok dersler/index.html'den ../images/logo.svg yoluna gider.</desc>
  <defs>
    <marker id="okMavi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/></marker>
    <marker id="okTuruncu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1570a"/></marker>
    <marker id="okYesil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2da44e"/></marker>
    <g id="klasor"><path d="M0 4 h7 l2 -3 h9 v15 h-18 z" fill="#f5c451" stroke="#bf8700"/></g>
    <g id="dosya"><path d="M2 0 h9 l4 4 v13 h-13 z" fill="#ffffff" stroke="#57606a"/></g>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1f2328">
    <!-- Ağaç çizgileri -->
    <g stroke="#d0d7de" stroke-width="1.5" fill="none">
      <path d="M38 62 V305 M38 95 H52 M38 130 H52 M38 165 H52 M38 235 H52 M38 305 H52"/>
      <path d="M68 172 V200 H82"/>
      <path d="M68 242 V270 H82"/>
      <path d="M68 312 V375 M68 340 H82 M68 375 H82"/>
      <path d="M98 382 V410 H112"/>
    </g>
    <use href="#klasor" x="20" y="40"/><text x="46" y="55" font-weight="700">kucuk-site/</text>
    <text x="140" y="55" fill="#57606a" font-size="13">(site kökü)</text>
    <use href="#dosya" x="54" y="82"/><text x="76" y="99">index.html</text>
    <use href="#dosya" x="54" y="117"/><text x="76" y="134">hakkimizda.html</text>
    <use href="#klasor" x="52" y="152"/><text x="76" y="169">images/</text>
    <use href="#dosya" x="84" y="187"/><text x="106" y="204">logo.svg</text>
    <use href="#klasor" x="52" y="222"/><text x="76" y="239">dosyalar/</text>
    <use href="#dosya" x="84" y="257"/><text x="106" y="274">ders-plani.txt</text>
    <use href="#klasor" x="52" y="292"/><text x="76" y="309">dersler/</text>
    <use href="#dosya" x="84" y="327"/><text x="106" y="344">index.html</text>
    <use href="#klasor" x="82" y="362"/><text x="106" y="379">web/</text>
    <use href="#dosya" x="114" y="397"/><text x="136" y="414">html-notlari.html</text>
  </g>

  <!-- Oklar -->
  <g fill="none" stroke-width="2.5">
    <path d="M160 99 H330 V408 H270" stroke="#1f6feb" marker-end="url(#okMavi)"/>
    <path d="M270 416 H390 V91 H160" stroke="#d1570a" marker-end="url(#okTuruncu)"/>
    <path d="M190 340 H450 V200 H175" stroke="#2da44e" marker-end="url(#okYesil)"/>
  </g>

  <!-- Açıklamalar -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f2328">
    <line x1="500" y1="80" x2="540" y2="80" stroke="#1f6feb" stroke-width="3"/>
    <text x="550" y="76" font-weight="600">Alt klasöre inmek (index.html içinden)</text>
    <text x="550" y="96" font-family="Consolas, monospace" fill="#0a3069">href="dersler/web/html-notlari.html"</text>

    <line x1="500" y1="160" x2="540" y2="160" stroke="#d1570a" stroke-width="3"/>
    <text x="550" y="156" font-weight="600">Üst klasöre çıkmak (html-notlari.html içinden)</text>
    <text x="550" y="176" font-family="Consolas, monospace" fill="#0a3069">href="../../index.html"</text>
    <text x="550" y="196" fill="#57606a">her ../ bir üst klasöre çıkar: web/ → dersler/ → kök</text>

    <line x1="500" y1="260" x2="540" y2="260" stroke="#2da44e" stroke-width="3"/>
    <text x="550" y="256" font-weight="600">Önce çık, sonra in (dersler/index.html içinden)</text>
    <text x="550" y="276" font-family="Consolas, monospace" fill="#0a3069">src="../images/logo.svg"</text>

    <text x="500" y="350" fill="#57606a">Aynı klasör: href="hakkimizda.html" (yalnızca dosya adı)</text>
    <text x="500" y="372" fill="#57606a">Mutlak URL: href="https://www.nku.edu.tr/" (tam adres)</text>
  </g>
</svg>
