<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">Bir HTML öğesinin anatomisi</title>
  <desc id="d">a href="https://www.nku.edu.tr" öğesinde açılış etiketi, nitelik adı, nitelik değeri, içerik ve kapanış etiketi gösterilir; altta boş öğe örneği img yer alır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Kod satırı -->
    <g font-family="Consolas, Courier New, monospace" font-size="20">
      <rect x="30" y="95" width="380" height="40" rx="4" fill="#ddf4ff" stroke="#1f6feb"/>
      <rect x="410" y="95" width="160" height="40" rx="4" fill="#dafbe1" stroke="#2da44e"/>
      <rect x="570" y="95" width="50" height="40" rx="4" fill="#ddf4ff" stroke="#1f6feb"/>
      <text x="40" y="122" fill="#1f2328">&lt;a <tspan fill="#cf222e">href</tspan>="<tspan fill="#0a3069">https://www.nku.edu.tr</tspan>"&gt;</text>
      <text x="418" y="122" fill="#1f2328">Üniversitemiz</text>
      <text x="574" y="122" fill="#1f2328">&lt;/a&gt;</text>
    </g>

    <!-- Üst etiketler -->
    <g font-size="14" fill="#1f2328" text-anchor="middle">
      <line x1="62" y1="95" x2="62" y2="62" stroke="#57606a"/>
      <text x="62" y="54">etiket adı</text>
      <line x1="100" y1="95" x2="130" y2="62" stroke="#cf222e"/>
      <text x="160" y="54" fill="#cf222e">nitelik adı</text>
      <line x1="260" y1="95" x2="300" y2="62" stroke="#0a3069"/>
      <text x="300" y="54" fill="#0a3069">nitelik değeri (çift tırnak içinde)</text>
      <line x1="490" y1="95" x2="490" y2="62" stroke="#2da44e"/>
      <text x="490" y="54" fill="#1a7f37">içerik</text>
      <line x1="595" y1="95" x2="650" y2="62" stroke="#57606a"/>
      <text x="700" y="54">kapanış etiketi (/ içerir)</text>
    </g>

    <!-- Alt parantezler -->
    <g fill="none" stroke-width="2">
      <path d="M32 145 v10 h376 v-10" stroke="#1f6feb"/>
      <path d="M572 145 v10 h46 v-10" stroke="#1f6feb"/>
      <path d="M32 190 v10 h586 v-10" stroke="#bf8700"/>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="220" y="176" fill="#1f6feb">açılış etiketi</text>
      <text x="595" y="176" fill="#1f6feb">kapanış</text>
      <text x="325" y="222" fill="#9a6700" font-weight="600">ÖĞE (element) = açılış etiketi + içerik + kapanış etiketi</text>
    </g>

    <!-- Boş öğe -->
    <line x1="30" y1="250" x2="870" y2="250" stroke="#d0d7de"/>
    <text x="30" y="280" font-size="15" font-weight="600" fill="#1f2328">Boş öğe (void element): içerik ve kapanış etiketi yoktur</text>
    <g font-family="Consolas, Courier New, monospace" font-size="18">
      <rect x="30" y="296" width="560" height="38" rx="4" fill="#ddf4ff" stroke="#1f6feb"/>
      <text x="40" y="321" fill="#1f2328">&lt;img <tspan fill="#cf222e">src</tspan>="<tspan fill="#0a3069">kus.jpg</tspan>" <tspan fill="#cf222e">alt</tspan>="<tspan fill="#0a3069">Dalda öten kuş</tspan>"&gt;</text>
    </g>
    <text x="610" y="313" font-size="14" fill="#57606a">Nitelikler boşlukla ayrılır.</text>
    <text x="610" y="331" font-size="14" fill="#57606a">Diğer örnekler: br, hr, meta, input</text>
  </g>
</svg>
