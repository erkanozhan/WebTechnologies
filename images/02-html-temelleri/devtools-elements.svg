<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="t d">
  <title id="t">Tarayıcı geliştirici araçlarında Elements paneli</title>
  <desc id="d">Solda tarayıcıda açık sayfa ve seçili Merhaba Web başlığı, sağda Elements panelinde DOM ağacı ve seçili h1 satırı ile altında Styles bölmesi gösterilir. F12 veya sağ tık İncele ile açılır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Tarayıcı çerçevesi -->
    <rect x="20" y="20" width="900" height="370" rx="6" fill="#ffffff" stroke="#57606a"/>
    <rect x="20" y="20" width="900" height="40" rx="6" fill="#eaeef2"/>
    <rect x="40" y="28" width="460" height="24" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="56" y="45" font-size="13" fill="#57606a">127.0.0.1:5500/index.html</text>

    <!-- Sayfa alanı -->
    <rect x="34" y="78" width="214" height="44" fill="#a8d1ff" fill-opacity="0.5" stroke="#1f6feb" stroke-dasharray="4 3"/>
    <text x="40" y="110" font-family="Times New Roman, serif" font-size="30" font-weight="700" fill="#1f2328">Merhaba Web!</text>
    <text x="40" y="178" font-family="Times New Roman, serif" font-size="16" fill="#1f2328">Bu sayfa ilk HTML belgemdir.</text>
    <rect x="34" y="126" width="110" height="22" rx="3" fill="#1f2328"/>
    <text x="42" y="142" font-size="12" fill="#ffffff">h1  214 × 44</text>

    <!-- DevTools paneli -->
    <rect x="440" y="60" width="480" height="330" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="440" y="60" width="480" height="30" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="456" y="80" font-size="13" font-weight="700" fill="#1f6feb">Elements</text>
    <line x1="452" y1="88" x2="522" y2="88" stroke="#1f6feb" stroke-width="2"/>
    <text x="540" y="80" font-size="13" fill="#57606a">Console</text>
    <text x="605" y="80" font-size="13" fill="#57606a">Sources</text>
    <text x="670" y="80" font-size="13" fill="#57606a">Network</text>
    <text x="740" y="80" font-size="13" fill="#57606a">…</text>

    <g font-family="Consolas, Courier New, monospace" font-size="13">
      <text x="452" y="112" fill="#57606a">&lt;!DOCTYPE html&gt;</text>
      <text x="452" y="132" fill="#881280">▾ &lt;html <tspan fill="#994500">lang</tspan>=<tspan fill="#1a1aa6">"tr"</tspan>&gt;</text>
      <text x="468" y="152" fill="#881280">▸ &lt;head&gt;…&lt;/head&gt;</text>
      <text x="468" y="172" fill="#881280">▾ &lt;body&gt;</text>
      <rect x="441" y="179" width="478" height="20" fill="#cfe8fc"/>
      <text x="486" y="194" fill="#881280">&lt;h1&gt;<tspan fill="#1f2328">Merhaba Web!</tspan>&lt;/h1&gt; <tspan fill="#57606a">== $0</tspan></text>
      <text x="486" y="214" fill="#881280">&lt;p&gt;<tspan fill="#1f2328">Bu sayfa ilk HTML belgemdir.</tspan>&lt;/p&gt;</text>
      <text x="468" y="234" fill="#881280">&lt;/body&gt;</text>
      <text x="452" y="254" fill="#881280">&lt;/html&gt;</text>
    </g>

    <rect x="440" y="266" width="480" height="26" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="456" y="284" font-size="13" font-weight="700" fill="#1f2328">Styles</text>
    <text x="520" y="284" font-size="13" fill="#57606a">Computed</text>
    <g font-family="Consolas, Courier New, monospace" font-size="13">
      <text x="456" y="312" fill="#1f2328">h1 {   <tspan fill="#57606a">/* tarayıcı varsayılanı */</tspan></text>
      <text x="472" y="332" fill="#c80000">font-size<tspan fill="#1f2328">: 2em;</tspan></text>
      <text x="472" y="352" fill="#c80000">font-weight<tspan fill="#1f2328">: bold;</tspan></text>
      <text x="456" y="372" fill="#1f2328">}</text>
    </g>

    <!-- Açıklama -->
    <text x="34" y="230" font-size="14" fill="#1f2328" font-weight="600">Açmak için:</text>
    <text x="34" y="252" font-size="14" fill="#1f2328">F12 · Ctrl + Shift + I</text>
    <text x="34" y="274" font-size="14" fill="#1f2328">veya öğeye sağ tık → İncele</text>
    <text x="34" y="306" font-size="14" fill="#57606a">Kaynağı görüntüle: Ctrl + U</text>
    <text x="34" y="328" font-size="14" fill="#57606a">(sunucudan gelen ham HTML)</text>
    <text x="34" y="360" font-size="14" fill="#57606a">Elements: tarayıcının kurduğu</text>
    <text x="34" y="380" font-size="14" fill="#57606a">canlı DOM ağacı</text>
  </g>
</svg>
