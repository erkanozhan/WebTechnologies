<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">HTML belgesinin ağaç yapısı</title>
  <desc id="d">Kökte document ve html; html'in çocukları head ve body; head altında meta ve title, body altında h1, p ve ul; p altında em, ul altında iki li bulunur.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">
    <!-- Bağlantılar -->
    <g stroke="#8c959f" stroke-width="1.5">
      <line x1="450" y1="52" x2="450" y2="88"/>
      <line x1="450" y1="118" x2="230" y2="158"/>
      <line x1="450" y1="118" x2="640" y2="158"/>
      <line x1="230" y1="188" x2="150" y2="238"/>
      <line x1="230" y1="188" x2="310" y2="238"/>
      <line x1="640" y1="188" x2="500" y2="238"/>
      <line x1="640" y1="188" x2="640" y2="238"/>
      <line x1="640" y1="188" x2="790" y2="238"/>
      <line x1="640" y1="268" x2="640" y2="318"/>
      <line x1="790" y1="268" x2="745" y2="318"/>
      <line x1="790" y1="268" x2="845" y2="318"/>
    </g>
    <!-- Düğümler -->
    <rect x="395" y="22" width="110" height="30" rx="6" fill="#eaeef2" stroke="#57606a"/>
    <text x="450" y="42" fill="#1f2328">document</text>
    <rect x="400" y="88" width="100" height="30" rx="6" fill="#ddf4ff" stroke="#1f6feb"/>
    <text x="450" y="108" fill="#1f2328" font-weight="600">html</text>
    <rect x="180" y="158" width="100" height="30" rx="6" fill="#fff8c5" stroke="#bf8700"/>
    <text x="230" y="178" fill="#1f2328" font-weight="600">head</text>
    <rect x="590" y="158" width="100" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="640" y="178" fill="#1f2328" font-weight="600">body</text>
    <rect x="100" y="238" width="100" height="30" rx="6" fill="#fff8c5" stroke="#bf8700"/>
    <text x="150" y="258" fill="#1f2328">meta</text>
    <rect x="260" y="238" width="100" height="30" rx="6" fill="#fff8c5" stroke="#bf8700"/>
    <text x="310" y="258" fill="#1f2328">title</text>
    <rect x="450" y="238" width="100" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="500" y="258" fill="#1f2328">h1</text>
    <rect x="590" y="238" width="100" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="640" y="258" fill="#1f2328">p</text>
    <rect x="740" y="238" width="100" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="790" y="258" fill="#1f2328">ul</text>
    <rect x="600" y="318" width="80" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="640" y="338" fill="#1f2328">em</text>
    <rect x="710" y="318" width="70" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="745" y="338" fill="#1f2328">li</text>
    <rect x="810" y="318" width="70" height="30" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="845" y="338" fill="#1f2328">li</text>
  </g>
  <!-- Açıklamalar -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#57606a">
    <text x="20" y="90">kök öğe</text>
    <line x1="80" y1="86" x2="395" y2="102" stroke="#d0d7de" stroke-dasharray="4 3"/>
    <text x="20" y="310">head: belge hakkında bilgi (görünmez)</text>
    <text x="20" y="332">body: tarayıcıda görünen içerik</text>
    <text x="20" y="378">html, head ve body'nin ebeveynidir; head ile body kardeştir; em, p'nin çocuğudur.</text>
  </g>
</svg>
