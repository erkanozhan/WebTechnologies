<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Yazı tipi yığını</title>
  <desc id="d">Tarayıcı font-family listesindeki yazı tiplerini soldan sağa dener; ilk bulduğunu kullanır, hiçbiri yoksa jenerik aileye düşer.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ok" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="430" y="34" font-size="17" text-anchor="middle" fill="#1f2328" font-family="Consolas, monospace">font-family: "Lora", Georgia, "Times New Roman", serif;</text>
  <g font-size="15" text-anchor="middle">
    <rect x="20" y="70" width="170" height="70" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="105" y="100" fill="#1f2328" font-weight="700">"Lora"</text>
    <text x="105" y="123" fill="#cf222e">yüklü değil</text>
    <rect x="235" y="70" width="170" height="70" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
    <text x="320" y="100" fill="#1f2328" font-weight="700">Georgia</text>
    <text x="320" y="123" fill="#1a7f37">bulundu: kullanılır</text>
    <rect x="450" y="70" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="535" y="100" fill="#57606a" font-weight="700">"Times New Roman"</text>
    <text x="535" y="123" fill="#57606a">denenmez</text>
    <rect x="665" y="70" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="750" y="100" fill="#57606a" font-weight="700">serif</text>
    <text x="750" y="123" fill="#57606a">jenerik aile (son çare)</text>
  </g>
  <g stroke="#57606a" stroke-width="2" marker-end="url(#ok)">
    <line x1="190" y1="105" x2="232" y2="105"/>
    <line x1="405" y1="105" x2="447" y2="105"/>
    <line x1="620" y1="105" x2="662" y2="105"/>
  </g>
  <g font-size="14" fill="#1f2328">
    <text x="20" y="180">1. Tarayıcı listeyi soldan sağa okur; her ad için cihazda yüklü ya da @font-face ile indirilmiş bir yazı tipi arar.</text>
    <text x="20" y="205">2. İlk eşleşen yazı tipi kullanılır; listenin geri kalanı dikkate alınmaz.</text>
    <text x="20" y="230">3. Hiçbir ad eşleşmezse en sondaki jenerik aile (serif, sans-serif, monospace …) devreye girer.</text>
    <text x="20" y="255">4. Bir karakter (ör. ğ, ş, İ) seçilen yazı tipinde yoksa yalnızca o karakter için listedeki sonraki yazı tipine bakılır.</text>
  </g>
</svg>
