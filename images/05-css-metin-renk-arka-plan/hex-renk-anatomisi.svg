<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Onaltılık renk kodunun anatomisi</title>
  <desc id="d">#1F6FEB kodu üç çifte ayrılır: 1F kırmızı 31, 6F yeşil 111, EB mavi 235; sonuç rgb(31 111 235).</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Consolas, monospace" font-size="56" font-weight="700" text-anchor="middle">
    <text x="170" y="90" fill="#57606a">#</text>
    <text x="270" y="90" fill="#cf222e">1F</text>
    <text x="410" y="90" fill="#2da44e">6F</text>
    <text x="550" y="90" fill="#1f6feb">EB</text>
  </g>
  <rect x="660" y="35" width="160" height="80" rx="10" fill="#1f6feb"/>
  <text x="740" y="82" font-size="15" text-anchor="middle" fill="#ffffff">#1F6FEB</text>
  <g stroke-width="2">
    <line x1="270" y1="105" x2="270" y2="140" stroke="#cf222e"/>
    <line x1="410" y1="105" x2="410" y2="140" stroke="#2da44e"/>
    <line x1="550" y1="105" x2="550" y2="140" stroke="#1f6feb"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#1f2328">
    <text x="270" y="165" font-weight="700" fill="#cf222e">Kırmızı (R)</text>
    <text x="410" y="165" font-weight="700" fill="#1a7f37">Yeşil (G)</text>
    <text x="550" y="165" font-weight="700" fill="#1f6feb">Mavi (B)</text>
    <text x="270" y="192">1×16 + 15 = 31</text>
    <text x="410" y="192">6×16 + 15 = 111</text>
    <text x="550" y="192">14×16 + 11 = 235</text>
  </g>
  <g font-size="15" fill="#1f2328">
    <text x="40" y="238">Her çift 00 (0) ile FF (255) arasında bir değerdir; A=10, B=11, C=12, D=13, E=14, F=15.</text>
    <text x="40" y="266" font-family="Consolas, monospace">#1F6FEB  =  rgb(31 111 235)  =  rgb(31, 111, 235)</text>
  </g>
</svg>
