<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 320" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">background-size: cover ve contain</title>
  <desc id="d">2:1 oranlı yatay bir görsel kare bir kutuya cover ile yerleştirildiğinde kutuyu tamamen kaplar ve yanlardan kırpılır; contain ile görselin tamamı görünür ancak üstte ve altta boşluk kalır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <g id="manzara">
      <rect width="300" height="150" fill="#9fd3ff"/>
      <circle cx="250" cy="35" r="18" fill="#ffd33d"/>
      <polygon points="0,150 90,50 180,150" fill="#57606a"/>
      <polygon points="100,150 200,70 300,150" fill="#2da44e"/>
    </g>
    <clipPath id="kutu-kirp">
      <rect x="320" y="70" width="200" height="200"/>
    </clipPath>
  </defs>
  <text x="110" y="36" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">Görsel (2:1)</text>
  <use xlink:href="#manzara" href="#manzara" transform="translate(20 125) scale(0.6)"/>
  <text x="110" y="250" font-size="14" text-anchor="middle" fill="#57606a">300 × 150 görsel,</text>
  <text x="110" y="270" font-size="14" text-anchor="middle" fill="#57606a">200 × 200 kutuya</text>

  <text x="420" y="36" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">cover</text>
  <use xlink:href="#manzara" href="#manzara" transform="translate(220 70) scale(1.3333)" opacity="0.25"/>
  <g clip-path="url(#kutu-kirp)">
    <use xlink:href="#manzara" href="#manzara" transform="translate(220 70) scale(1.3333)"/>
  </g>
  <rect x="320" y="70" width="200" height="200" fill="none" stroke="#cf222e" stroke-width="3"/>
  <text x="420" y="300" font-size="14" text-anchor="middle" fill="#1f2328">Kutu tamamen dolar; taşan yanlar (soluk) kırpılır</text>

  <text x="745" y="36" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">contain</text>
  <rect x="645" y="70" width="200" height="200" fill="#f6f8fa"/>
  <use xlink:href="#manzara" href="#manzara" transform="translate(645 120) scale(0.6667)"/>
  <rect x="645" y="70" width="200" height="200" fill="none" stroke="#1f6feb" stroke-width="3"/>
  <text x="745" y="300" font-size="14" text-anchor="middle" fill="#1f2328">Tamamı görünür; boşluk kalır</text>
</svg>
