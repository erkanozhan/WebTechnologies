<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Çoklu arka plan katmanları</title>
  <desc id="d">background özelliğinde virgülle ayrılan katmanlardan ilk yazılan en üstte çizilir; arka plan rengi her zaman en alttadır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-size="15" fill="#1f2328">
    <polygon points="60,240 360,240 460,180 160,180" fill="#1f6feb" stroke="#0550ae" stroke-width="2"/>
    <polygon points="60,170 360,170 460,110 160,110" fill="#9fd3ff" fill-opacity="0.9" stroke="#1f6feb" stroke-width="2"/>
    <polygon points="60,100 360,100 460,40 160,40" fill="#ffd33d" fill-opacity="0.8" stroke="#bf8700" stroke-width="2"/>
    <line x1="465" y1="70" x2="500" y2="70" stroke="#57606a"/>
    <line x1="465" y1="140" x2="500" y2="140" stroke="#57606a"/>
    <line x1="465" y1="210" x2="500" y2="210" stroke="#57606a"/>
    <text x="510" y="75" font-weight="700">1. katman (ilk yazılan): en üstte</text>
    <text x="510" y="145" font-weight="700">2. katman</text>
    <text x="510" y="215" font-weight="700">background-color: her zaman en altta</text>
  </g>
  <g font-family="Consolas, monospace" font-size="14" fill="#1f2328">
    <text x="30" y="285" xml:space="preserve">background: url("yildizlar.svg") top / 40px,       /* 1. katman */</text>
    <text x="30" y="305" xml:space="preserve">            linear-gradient(#9fd3ff, #ffffff),    /* 2. katman */</text>
    <text x="30" y="325" xml:space="preserve">            #1f6feb;           /* renk yalnızca son katmanda yazılabilir */</text>
  </g>
</svg>
