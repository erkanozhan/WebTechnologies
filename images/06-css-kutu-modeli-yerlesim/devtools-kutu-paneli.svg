  <rect x="40" y="44" width="560" height="290" fill="#f9cc9d" stroke="#57606a" stroke-dasharray="4 3"/>
  <text x="50" y="62" font-size="13" fill="#24292f">margin</text>
  <text x="320" y="62" font-size="14" fill="#24292f" text-anchor="middle">24</text>
