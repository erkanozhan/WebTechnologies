<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">margin ve padding kısayolunda değer sayısı</title>
  <desc id="d">Bir, iki, üç ve dört değerli yazımda değerlerin hangi kenara uygulandığı. Dört değer üstten başlayıp saat yönünde üst, sağ, alt, sol sırasıyla okunur.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
  <g transform="translate(20,0)">
    <text x="90" y="30" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#24292f">margin: 10px;</text>
    <rect x="40" y="60" width="100" height="100" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="90" y="115" font-size="13" text-anchor="middle" fill="#0a3069">kutu</text>
    <text x="90" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">10</text>
    <text x="150" y="115" font-size="15" font-weight="bold" text-anchor="start" fill="#cf222e">10</text>
    <text x="90" y="180" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">10</text>
    <text x="30" y="115" font-size="15" font-weight="bold" text-anchor="end" fill="#cf222e">10</text>
    <text x="90" y="215" font-size="13" text-anchor="middle" fill="#57606a">Dört kenar aynı</text>
  </g>
  <g transform="translate(225,0)">
    <text x="90" y="30" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#24292f">margin: 10px 20px;</text>
    <rect x="40" y="60" width="100" height="100" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="90" y="115" font-size="13" text-anchor="middle" fill="#0a3069">kutu</text>
    <text x="90" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">10</text>
    <text x="150" y="115" font-size="15" font-weight="bold" text-anchor="start" fill="#cf222e">20</text>
    <text x="90" y="180" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">10</text>
    <text x="30" y="115" font-size="15" font-weight="bold" text-anchor="end" fill="#cf222e">20</text>
    <text x="90" y="215" font-size="13" text-anchor="middle" fill="#57606a">üst-alt | sağ-sol</text>
  </g>
  <g transform="translate(430,0)">
    <text x="90" y="30" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#24292f">margin: 10px 20px 30px;</text>
    <rect x="40" y="60" width="100" height="100" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="90" y="115" font-size="13" text-anchor="middle" fill="#0a3069">kutu</text>
    <text x="90" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">10</text>
    <text x="150" y="115" font-size="15" font-weight="bold" text-anchor="start" fill="#cf222e">20</text>
    <text x="90" y="180" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">30</text>
    <text x="30" y="115" font-size="15" font-weight="bold" text-anchor="end" fill="#cf222e">20</text>
    <text x="90" y="215" font-size="13" text-anchor="middle" fill="#57606a">üst | sağ-sol | alt</text>
  </g>
  <g transform="translate(635,0)">
    <text x="90" y="30" font-size="13" font-family="Consolas, monospace" text-anchor="middle" fill="#24292f">margin: 10px 20px 30px 40px;</text>
    <rect x="40" y="60" width="100" height="100" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="90" y="115" font-size="13" text-anchor="middle" fill="#0a3069">kutu</text>
    <text x="90" y="52" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">10</text>
    <text x="150" y="115" font-size="15" font-weight="bold" text-anchor="start" fill="#cf222e">20</text>
    <text x="90" y="180" font-size="15" font-weight="bold" text-anchor="middle" fill="#cf222e">30</text>
    <text x="30" y="115" font-size="15" font-weight="bold" text-anchor="end" fill="#cf222e">40</text>
    <text x="90" y="215" font-size="13" text-anchor="middle" fill="#57606a">üst | sağ | alt | sol</text>
  </g>
  <text x="20" y="258" font-size="14" fill="#24292f">Dört değer: üst → sağ → alt → sol (saat yönü). Eksik değer karşı kenardan kopyalanır:</text>
  <text x="20" y="284" font-size="14" fill="#24292f">sol verilmezse sağ, alt verilmezse üst değeri kullanılır. Aynı kural padding, border-width ve border-color için geçerlidir.</text>
</svg>
