<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Dikey kenar boşluğu çökmesi</title>
  <desc id="d">Üstteki paragrafın alt boşluğu 25 piksel, alttakinin üst boşluğu 15 pikseldir. Beklenen 40 piksel yerine aradaki boşluk büyük olan değer, yani 25 piksel olur.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#24292f">p { margin-top: 15px; margin-bottom: 25px; }</text>
  <!-- left: expected (wrong) -->
  <text x="40" y="62" font-size="14" font-weight="bold" fill="#cf222e">Beklenen (yanlış): 25 + 15 = 40 px</text>
  <rect x="40" y="76" width="280" height="50" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="180" y="106" font-size="14" text-anchor="middle" fill="#0a3069">1. paragraf</text>
  <rect x="40" y="126" width="280" height="50" fill="#fff8c5"/>
  <text x="180" y="156" font-size="13" text-anchor="middle" fill="#7d4e00">margin-bottom 25</text>
  <rect x="40" y="176" width="280" height="30" fill="#ffebe9"/>
  <text x="180" y="196" font-size="13" text-anchor="middle" fill="#a40e26">margin-top 15</text>
  <rect x="40" y="206" width="280" height="50" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="180" y="236" font-size="14" text-anchor="middle" fill="#0a3069">2. paragraf</text>
  <!-- right: actual -->
  <text x="420" y="62" font-size="14" font-weight="bold" fill="#2da44e">Gerçekte: max(25, 15) = 25 px</text>
  <rect x="420" y="76" width="280" height="50" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="560" y="106" font-size="14" text-anchor="middle" fill="#0a3069">1. paragraf</text>
  <rect x="420" y="126" width="280" height="50" fill="#fff8c5"/>
  <rect x="420" y="126" width="280" height="30" fill="#ffebe9" fill-opacity="0.7"/>
  <text x="560" y="156" font-size="13" text-anchor="middle" fill="#7d4e00">25 ve 15 üst üste biner</text>
  <rect x="420" y="176" width="280" height="50" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="560" y="206" font-size="14" text-anchor="middle" fill="#0a3069">2. paragraf</text>
  <text x="20" y="290" font-size="14" fill="#24292f">Çökme yalnızca normal akıştaki blok kutuların dikey (üst/alt) margin'lerinde olur; yatay margin'ler,</text>
  <text x="20" y="312" font-size="14" fill="#24292f">padding ve kenarlık çökmez. Flex/Grid öğeleri, float'lar ve absolute konumlu öğeler de çökmeye katılmaz.</text>
</svg>
