<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-labelledby="baslik aciklama" font-family="Segoe UI, Arial, sans-serif">
  <title id="baslik">HTML belgesi ve DOM ağacı</title>
  <desc id="aciklama">Solda kısa bir HTML belgesi, sağda tarayıcının bu belgeden oluşturduğu DOM ağacı gösterilmektedir. En üstte belge düğümü, altında html öğesi, onun altında head ve body öğeleri, en altta metin düğümleri yer alır; lang, id ve class nitelikleri kesikli kutularla gösterilmiştir.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Sol: HTML kaynak kodu -->
  <rect x="12" y="20" width="380" height="392" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="28" y="46" font-size="14" font-weight="600" fill="#57606a">HTML kaynak kodu</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#24292f">
    <text x="28" y="80">&lt;!DOCTYPE html&gt;</text>
    <text x="28" y="106">&lt;html <tspan fill="#bf8700">lang="tr"</tspan>&gt;</text>
    <text x="43" y="132">&lt;head&gt;</text>
    <text x="59" y="158">&lt;title&gt;<tspan fill="#2da44e">Duyurular</tspan>&lt;/title&gt;</text>
    <text x="43" y="184">&lt;/head&gt;</text>
    <text x="43" y="210">&lt;body&gt;</text>
    <text x="59" y="236">&lt;h1&gt;<tspan fill="#2da44e">Duyurular</tspan>&lt;/h1&gt;</text>
    <text x="59" y="262">&lt;ul <tspan fill="#bf8700">id="liste"</tspan>&gt;</text>
    <text x="74" y="288">&lt;li <tspan fill="#bf8700">class="yeni"</tspan>&gt;<tspan fill="#2da44e">Vize</tspan>&lt;/li&gt;</text>
    <text x="59" y="314">&lt;/ul&gt;</text>
    <text x="43" y="340">&lt;/body&gt;</text>
    <text x="28" y="366">&lt;/html&gt;</text>
  </g>

  <!-- Ok: tarayıcı ayrıştırır -->
  <g>
    <line x1="398" y1="216" x2="436" y2="216" stroke="#57606a" stroke-width="2"/>
    <polygon points="436,209 448,216 436,223" fill="#57606a"/>
    <text x="400" y="204" font-size="13" fill="#57606a">ayrıştırma</text>
  </g>

  <!-- Bağlantı çizgileri -->
  <g stroke="#57606a" stroke-width="1.6" fill="none">
    <line x1="690" y1="57" x2="690" y2="88"/>
    <line x1="690" y1="122" x2="560" y2="158"/>
    <line x1="690" y1="122" x2="800" y2="158"/>
    <line x1="560" y1="192" x2="490" y2="228"/>
    <line x1="490" y1="262" x2="490" y2="298"/>
    <line x1="800" y1="192" x2="680" y2="228"/>
    <line x1="800" y1="192" x2="860" y2="228"/>
    <line x1="680" y1="262" x2="680" y2="298"/>
    <line x1="860" y1="262" x2="860" y2="298"/>
    <line x1="860" y1="332" x2="860" y2="368"/>
  </g>
  <g stroke="#bf8700" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <line x1="735" y1="105" x2="790" y2="105"/>
    <line x1="905" y1="245" x2="925" y2="245"/>
    <line x1="905" y1="315" x2="925" y2="315"/>
  </g>

  <!-- Belge düğümü -->
  <rect x="625" y="23" width="130" height="34" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.6"/>
  <text x="690" y="45" font-size="15" text-anchor="middle" fill="#24292f" font-weight="600">document</text>

  <!-- Öğe düğümleri -->
  <g font-size="15" text-anchor="middle" fill="#ffffff" font-weight="600">
    <rect x="645" y="88" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="690" y="110">html</text>
    <rect x="515" y="158" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="560" y="180">head</text>
    <rect x="755" y="158" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="800" y="180">body</text>
    <rect x="445" y="228" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="490" y="250">title</text>
    <rect x="635" y="228" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="680" y="250">h1</text>
    <rect x="815" y="228" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="860" y="250">ul</text>
    <rect x="815" y="298" width="90" height="34" rx="8" fill="#1f6feb"/>
    <text x="860" y="320">li</text>
  </g>

  <!-- Metin düğümleri -->
  <g font-size="14" text-anchor="middle" fill="#1a7f37">
    <rect x="440" y="298" width="100" height="34" rx="17" fill="#dafbe1" stroke="#2da44e" stroke-width="1.6"/>
    <text x="490" y="320">"Duyurular"</text>
    <rect x="630" y="298" width="100" height="34" rx="17" fill="#dafbe1" stroke="#2da44e" stroke-width="1.6"/>
    <text x="680" y="320">"Duyurular"</text>
    <rect x="820" y="368" width="80" height="34" rx="17" fill="#dafbe1" stroke="#2da44e" stroke-width="1.6"/>
    <text x="860" y="390">"Vize"</text>
  </g>

  <!-- Nitelikler -->
  <g font-size="14" text-anchor="middle" fill="#7d4e00">
    <rect x="790" y="88" width="96" height="34" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="838" y="110">lang="tr"</text>
    <rect x="925" y="228" width="100" height="34" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="975" y="250">id="liste"</text>
    <rect x="925" y="298" width="108" height="34" rx="6" fill="#fff8c5" stroke="#bf8700" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="979" y="320">class="yeni"</text>
  </g>

  <!-- Gösterge -->
  <g font-size="14" fill="#24292f">
    <rect x="20" y="440" width="22" height="18" rx="4" fill="#eaeef2" stroke="#57606a"/>
    <text x="50" y="454">Belge düğümü</text>
    <rect x="190" y="440" width="22" height="18" rx="4" fill="#1f6feb"/>
    <text x="220" y="454">Öğe düğümü</text>
    <rect x="350" y="440" width="22" height="18" rx="9" fill="#dafbe1" stroke="#2da44e"/>
    <text x="380" y="454">Metin düğümü</text>
    <rect x="520" y="440" width="22" height="18" rx="4" fill="#fff8c5" stroke="#bf8700" stroke-dasharray="4 3"/>
    <text x="550" y="454">Nitelik (öğeye bağlı, ağacın dalı değil)</text>
  </g>
</svg>
