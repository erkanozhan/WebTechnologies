<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Sol: colspan ===== -->
  <text x="20" y="30" font-weight="bold" fill="#1f6feb">colspan: hücre sağa doğru sütunlara yayılır</text>

  <!-- 1. satır: tek hücre 3 sütun -->
  <rect x="20" y="50" width="360" height="50" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <line x1="140" y1="50" x2="140" y2="100" stroke="#1f6feb" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="260" y1="50" x2="260" y2="100" stroke="#1f6feb" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="200" y="81" text-anchor="middle" font-weight="bold">Kırtasiye Stok Raporu</text>

  <!-- 2. satır -->
  <rect x="20" y="100" width="120" height="44" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <rect x="140" y="100" width="120" height="44" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <rect x="260" y="100" width="120" height="44" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="80" y="128" text-anchor="middle">Ürün Adı</text>
  <text x="200" y="128" text-anchor="middle">Stok</text>
  <text x="320" y="128" text-anchor="middle">Satış</text>

  <!-- ok -->
  <line x1="30" y1="166" x2="370" y2="166" stroke="#1f6feb" stroke-width="2" marker-end="url(#ok)"/>
  <text x="200" y="188" text-anchor="middle" fill="#1f6feb">1 hücre = 3 sütun genişliği</text>

  <rect x="20" y="205" width="360" height="100" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="32" y="230" font-family="Consolas, monospace" font-size="14">&lt;tr&gt;</text>
  <text x="48" y="252" font-family="Consolas, monospace" font-size="14">&lt;th <tspan fill="#cf222e">colspan="3"</tspan>&gt;Kırtasiye…&lt;/th&gt;</text>
  <text x="32" y="274" font-family="Consolas, monospace" font-size="14">&lt;/tr&gt;</text>
  <text x="32" y="296" fill="#57606a" font-size="14">Bu satırda yalnızca 1 hücre yazılır.</text>

  <!-- ===== Sağ: rowspan ===== -->
  <text x="420" y="30" font-weight="bold" fill="#2da44e">rowspan: hücre aşağı doğru satırlara yayılır</text>

  <rect x="420" y="50" width="120" height="94" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
  <line x1="420" y1="97" x2="540" y2="97" stroke="#2da44e" stroke-dasharray="4,4" opacity="0.5"/>
  <text x="480" y="102" text-anchor="middle" font-weight="bold">Kırtasiye</text>

  <rect x="540" y="50" width="120" height="47" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <rect x="660" y="50" width="120" height="47" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="600" y="79" text-anchor="middle">Kalem</text>
  <text x="720" y="79" text-anchor="middle">114</text>

  <rect x="540" y="97" width="120" height="47" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <rect x="660" y="97" width="120" height="47" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="600" y="126" text-anchor="middle">Defter</text>
  <text x="720" y="126" text-anchor="middle">89</text>

  <line x1="412" y1="56" x2="412" y2="140" stroke="#2da44e" stroke-width="2" marker-end="url(#okyesil)"/>
  <text x="600" y="172" text-anchor="middle" fill="#2da44e">1 hücre = 2 satır yüksekliği</text>

  <rect x="420" y="205" width="360" height="100" rx="4" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="432" y="230" font-family="Consolas, monospace" font-size="14">&lt;tr&gt;&lt;td <tspan fill="#cf222e">rowspan="2"</tspan>&gt;Kırtasiye&lt;/td&gt;</text>
  <text x="432" y="252" font-family="Consolas, monospace" font-size="14">    &lt;td&gt;Kalem&lt;/td&gt;&lt;td&gt;114&lt;/td&gt;&lt;/tr&gt;</text>
  <text x="432" y="274" font-family="Consolas, monospace" font-size="14">&lt;tr&gt;&lt;td&gt;Defter&lt;/td&gt;&lt;td&gt;89&lt;/td&gt;&lt;/tr&gt;</text>
  <text x="432" y="296" fill="#57606a" font-size="14">2. satırda ilk sütun için td yazılmaz.</text>

  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="okyesil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2da44e"/>
    </marker>
  </defs>
</svg>
