<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- table etiketi -->
  <text x="150" y="28" fill="#cf222e" font-weight="bold" font-family="Consolas, monospace">&lt;table&gt;</text>
  <rect x="150" y="40" width="450" height="225" fill="none" stroke="#cf222e" stroke-width="2.5"/>

  <!-- satır kılavuz çizgileri -->
  <line x1="20" y1="70" x2="620" y2="70" stroke="#1f6feb" stroke-dasharray="5,4"/>
  <line x1="20" y1="145" x2="620" y2="145" stroke="#1f6feb" stroke-dasharray="5,4"/>
  <line x1="20" y1="220" x2="620" y2="220" stroke="#1f6feb" stroke-dasharray="5,4"/>
  <text x="20" y="96" fill="#1f6feb" font-weight="bold">satır</text>
  <text x="20" y="114" fill="#1f6feb" font-family="Consolas, monospace">&lt;tr&gt;</text>
  <text x="20" y="171" fill="#1f6feb" font-weight="bold">satır</text>
  <text x="20" y="189" fill="#1f6feb" font-family="Consolas, monospace">&lt;tr&gt;</text>
  <text x="20" y="246" fill="#1f6feb" font-weight="bold">satır</text>
  <text x="20" y="264" fill="#1f6feb" font-family="Consolas, monospace">&lt;tr&gt;</text>

  <!-- 1. satır: başlık hücreleri -->
  <g>
    <rect x="160" y="52" width="136" height="60" fill="#ddf4ff" stroke="#2da44e" stroke-width="2"/>
    <rect x="307" y="52" width="136" height="60" fill="#ddf4ff" stroke="#2da44e" stroke-width="2"/>
    <rect x="454" y="52" width="136" height="60" fill="#ddf4ff" stroke="#2da44e" stroke-width="2"/>
    <text x="168" y="98" font-weight="bold">Ürün Adı</text>
    <text x="315" y="98" font-weight="bold">Stok Miktarı</text>
    <text x="462" y="98" font-weight="bold">Satış Miktarı</text>
    <text x="290" y="68" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">th</text>
    <text x="437" y="68" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">th</text>
    <text x="584" y="68" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">th</text>
  </g>

  <!-- 2. satır -->
  <g>
    <rect x="160" y="127" width="136" height="60" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <rect x="307" y="127" width="136" height="60" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <rect x="454" y="127" width="136" height="60" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <text x="168" y="173">Kalem</text>
    <text x="315" y="173">114</text>
    <text x="462" y="173">50</text>
    <text x="290" y="143" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">td</text>
    <text x="437" y="143" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">td</text>
    <text x="584" y="143" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">td</text>
  </g>

  <!-- 3. satır -->
  <g>
    <rect x="160" y="202" width="136" height="55" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <rect x="307" y="202" width="136" height="55" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <rect x="454" y="202" width="136" height="55" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
    <text x="168" y="245">Defter</text>
    <text x="315" y="245">89</text>
    <text x="462" y="245">19</text>
    <text x="290" y="218" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">td</text>
    <text x="437" y="218" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">td</text>
    <text x="584" y="218" text-anchor="end" fill="#57606a" font-size="13" font-family="Consolas, monospace">td</text>
  </g>

  <!-- açıklama -->
  <rect x="628" y="70" width="18" height="18" fill="#ddf4ff" stroke="#2da44e" stroke-width="2"/>
  <text x="652" y="84">başlık hücresi</text>
  <text x="652" y="102" font-family="Consolas, monospace" fill="#57606a">&lt;th&gt;</text>
  <rect x="628" y="130" width="18" height="18" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
  <text x="652" y="144">veri hücresi</text>
  <text x="652" y="162" font-family="Consolas, monospace" fill="#57606a">&lt;td&gt;</text>
  <line x1="628" y1="196" x2="648" y2="196" stroke="#cf222e" stroke-width="2.5"/>
  <text x="652" y="201">tablo</text>
  <text x="652" y="219" font-family="Consolas, monospace" fill="#57606a">&lt;table&gt;</text>
</svg>
