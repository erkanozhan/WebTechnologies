<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Sol: radio -->
  <rect x="15" y="15" width="295" height="300" rx="8" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
  <text x="162" y="42" text-anchor="middle" font-weight="bold" fill="#1f6feb" font-family="Consolas, monospace">type="radio"</text>
  <text x="162" y="62" text-anchor="middle" fill="#57606a" font-size="14">Tek seçim: gruptan yalnızca biri</text>
  <text x="40" y="92" font-weight="bold">Yaş grubunuz</text>

  <circle cx="50" cy="118" r="9" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
  <circle cx="50" cy="118" r="4.5" fill="#1f6feb"/>
  <text x="68" y="123">25 altı</text>
  <circle cx="50" cy="150" r="9" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="68" y="155">25–34</text>
  <circle cx="50" cy="182" r="9" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="68" y="187">35–44</text>
  <circle cx="50" cy="214" r="9" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="68" y="219">45 ve üstü</text>

  <text x="30" y="254" font-size="14" fill="#cf222e">Hepsi aynı name="yas" değerini taşır;</text>
  <text x="30" y="274" font-size="14" fill="#cf222e">biri seçilince diğeri kendiliğinden kalkar.</text>
  <text x="30" y="300" font-size="14" fill="#57606a" font-family="Consolas, monospace">Gönderim: yas=25-alti</text>

  <!-- Sağ: checkbox -->
  <rect x="330" y="15" width="295" height="300" rx="8" fill="#ffffff" stroke="#2da44e" stroke-width="2"/>
  <text x="477" y="42" text-anchor="middle" font-weight="bold" fill="#2da44e" font-family="Consolas, monospace">type="checkbox"</text>
  <text x="477" y="62" text-anchor="middle" fill="#57606a" font-size="14">Çoklu seçim: sıfır, bir veya daha çok</text>
  <text x="355" y="92" font-weight="bold">Sevdiğiniz müzik türleri</text>

  <rect x="356" y="109" width="18" height="18" rx="3" fill="#2da44e"/>
  <polyline points="359,118 364,123 371,112" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="123">Halk</text>
  <rect x="356" y="141" width="18" height="18" rx="3" fill="#2da44e"/>
  <polyline points="359,150 364,155 371,144" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="155">Pop</text>
  <rect x="356" y="173" width="18" height="18" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="384" y="187">Rock</text>
  <rect x="356" y="205" width="18" height="18" rx="3" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="384" y="219">Caz</text>

  <text x="345" y="254" font-size="14" fill="#1a7f37">Her kutu bağımsızdır; aynı name ile</text>
  <text x="345" y="274" font-size="14" fill="#1a7f37">birden çok değer gönderilebilir.</text>
  <text x="345" y="300" font-size="14" fill="#57606a" font-family="Consolas, monospace">Gönderim: tur=halk&amp;tur=pop</text>
</svg>
