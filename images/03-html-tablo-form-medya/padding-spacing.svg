<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="uc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="ucm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <!-- a) padding -->
  <text x="20" y="28" font-weight="bold">a) İç dolgu</text>
  <text x="20" y="48" font-family="Consolas, monospace" font-size="14" fill="#cf222e">td { padding: 16px; }</text>
  <rect x="20" y="66" width="220" height="130" fill="#fff8c5" stroke="#24292f" stroke-width="2"/>
  <rect x="62" y="104" width="136" height="54" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4,3"/>
  <text x="130" y="137" text-anchor="middle">içerik</text>
  <line x1="22" y1="131" x2="60" y2="131" stroke="#cf222e" stroke-width="2" marker-start="url(#uc)" marker-end="url(#uc)"/>
  <line x1="130" y1="68" x2="130" y2="102" stroke="#cf222e" stroke-width="2" marker-start="url(#uc)" marker-end="url(#uc)"/>
  <text x="20" y="222" fill="#57606a">İçerik ile hücre kenarlığı arası</text>
  <text x="20" y="242" fill="#57606a">(eski HTML: <tspan font-family="Consolas, monospace">cellpadding</tspan>)</text>

  <!-- b) border-spacing -->
  <text x="285" y="28" font-weight="bold">b) Hücre aralığı</text>
  <text x="285" y="48" font-family="Consolas, monospace" font-size="14" fill="#1f6feb">table { border-spacing: 14px; }</text>
  <rect x="285" y="66" width="230" height="130" fill="#ddf4ff" stroke="#24292f" stroke-width="2"/>
  <rect x="299" y="80" width="94" height="44" fill="#ffffff" stroke="#57606a"/>
  <rect x="407" y="80" width="94" height="44" fill="#ffffff" stroke="#57606a"/>
  <rect x="299" y="138" width="94" height="44" fill="#ffffff" stroke="#57606a"/>
  <rect x="407" y="138" width="94" height="44" fill="#ffffff" stroke="#57606a"/>
  <text x="346" y="107" text-anchor="middle">Hücre 1</text>
  <text x="454" y="107" text-anchor="middle">Hücre 2</text>
  <text x="346" y="165" text-anchor="middle">Hücre 3</text>
  <text x="454" y="165" text-anchor="middle">Hücre 4</text>
  <line x1="394" y1="102" x2="406" y2="102" stroke="#1f6feb" stroke-width="4"/>
  <line x1="346" y1="125" x2="346" y2="137" stroke="#1f6feb" stroke-width="4"/>
  <text x="285" y="222" fill="#57606a">Komşu hücre kenarlıkları arası</text>
  <text x="285" y="242" fill="#57606a">(eski HTML: <tspan font-family="Consolas, monospace">cellspacing</tspan>)</text>

  <!-- c) collapse -->
  <text x="560" y="28" font-weight="bold">c) Birleşik kenarlık</text>
  <text x="560" y="48" font-family="Consolas, monospace" font-size="14" fill="#2da44e">border-collapse: collapse;</text>
  <rect x="560" y="80" width="110" height="51" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="670" y="80" width="110" height="51" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="560" y="131" width="110" height="51" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="670" y="131" width="110" height="51" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <text x="615" y="111" text-anchor="middle">Hücre 1</text>
  <text x="725" y="111" text-anchor="middle">Hücre 2</text>
  <text x="615" y="162" text-anchor="middle">Hücre 3</text>
  <text x="725" y="162" text-anchor="middle">Hücre 4</text>
  <text x="560" y="222" fill="#57606a">Kenarlıklar tek çizgide birleşir;</text>
  <text x="560" y="242" fill="#57606a"><tspan font-family="Consolas, monospace">border-spacing</tspan> etkisiz kalır</text>
</svg>
