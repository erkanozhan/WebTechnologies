<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- table -->
  <rect x="10" y="10" width="640" height="430" rx="6" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
  <text x="22" y="31" font-weight="bold" font-family="Consolas, monospace">&lt;table&gt;</text>

  <!-- caption -->
  <rect x="30" y="42" width="600" height="34" rx="4" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text x="42" y="64" font-family="Consolas, monospace" font-weight="bold" fill="#7d4e00">&lt;caption&gt;</text>
  <text x="150" y="64">Tablo başlığı (ilk çocuk olmalı)</text>

  <!-- colgroup -->
  <rect x="30" y="86" width="600" height="40" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="42" y="111" font-family="Consolas, monospace" font-weight="bold" fill="#57606a">&lt;colgroup&gt;</text>
  <rect x="190" y="93" width="120" height="26" rx="3" fill="#eaeef2" stroke="#8c959f"/>
  <text x="250" y="111" text-anchor="middle" font-family="Consolas, monospace">&lt;col&gt;</text>
  <rect x="320" y="93" width="120" height="26" rx="3" fill="#eaeef2" stroke="#8c959f"/>
  <text x="380" y="111" text-anchor="middle" font-family="Consolas, monospace">&lt;col&gt;</text>
  <rect x="450" y="93" width="120" height="26" rx="3" fill="#eaeef2" stroke="#8c959f"/>
  <text x="510" y="111" text-anchor="middle" font-family="Consolas, monospace">&lt;col&gt;</text>

  <!-- thead -->
  <rect x="30" y="136" width="600" height="72" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
  <text x="42" y="155" font-family="Consolas, monospace" font-weight="bold" fill="#1a7f37">&lt;thead&gt;</text>
  <rect x="50" y="162" width="560" height="38" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="60" y="186" font-family="Consolas, monospace">&lt;tr&gt;</text>
  <rect x="110" y="167" width="160" height="28" rx="3" fill="#ddf4ff" stroke="#1f6feb"/>
  <text x="120" y="186" font-family="Consolas, monospace">&lt;th&gt;</text><text x="160" y="186">Ürün Adı</text>
  <rect x="280" y="167" width="160" height="28" rx="3" fill="#ddf4ff" stroke="#1f6feb"/>
  <text x="290" y="186" font-family="Consolas, monospace">&lt;th&gt;</text><text x="330" y="186">Stok</text>
  <rect x="450" y="167" width="150" height="28" rx="3" fill="#ddf4ff" stroke="#1f6feb"/>
  <text x="460" y="186" font-family="Consolas, monospace">&lt;th&gt;</text><text x="500" y="186">Satış</text>

  <!-- tbody -->
  <rect x="30" y="218" width="600" height="118" rx="4" fill="#ddf4ff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="42" y="237" font-family="Consolas, monospace" font-weight="bold" fill="#0550ae">&lt;tbody&gt;</text>
  <rect x="50" y="244" width="560" height="38" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="60" y="268" font-family="Consolas, monospace">&lt;tr&gt;</text>
  <rect x="110" y="249" width="160" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="120" y="268" font-family="Consolas, monospace">&lt;td&gt;</text><text x="160" y="268">Kalem</text>
  <rect x="280" y="249" width="160" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="290" y="268" font-family="Consolas, monospace">&lt;td&gt;</text><text x="330" y="268">114</text>
  <rect x="450" y="249" width="150" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="460" y="268" font-family="Consolas, monospace">&lt;td&gt;</text><text x="500" y="268">50</text>
  <rect x="50" y="290" width="560" height="38" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="60" y="314" font-family="Consolas, monospace">&lt;tr&gt;</text>
  <rect x="110" y="295" width="160" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="120" y="314" font-family="Consolas, monospace">&lt;td&gt;</text><text x="160" y="314">Defter</text>
  <rect x="280" y="295" width="160" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="290" y="314" font-family="Consolas, monospace">&lt;td&gt;</text><text x="330" y="314">89</text>
  <rect x="450" y="295" width="150" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="460" y="314" font-family="Consolas, monospace">&lt;td&gt;</text><text x="500" y="314">19</text>

  <!-- tfoot -->
  <rect x="30" y="346" width="600" height="72" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="42" y="365" font-family="Consolas, monospace" font-weight="bold" fill="#953800">&lt;tfoot&gt;</text>
  <rect x="50" y="372" width="560" height="38" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="60" y="396" font-family="Consolas, monospace">&lt;tr&gt;</text>
  <rect x="110" y="377" width="160" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="120" y="396" font-family="Consolas, monospace">&lt;th&gt;</text><text x="160" y="396">Toplam</text>
  <rect x="280" y="377" width="160" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="290" y="396" font-family="Consolas, monospace">&lt;td&gt;</text><text x="330" y="396">203</text>
  <rect x="450" y="377" width="150" height="28" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <text x="460" y="396" font-family="Consolas, monospace">&lt;td&gt;</text><text x="500" y="396">69</text>

  <text x="330" y="466" text-anchor="middle" fill="#57606a">Yazım sırası: caption → colgroup → thead → tbody → tfoot</text>
</svg>
