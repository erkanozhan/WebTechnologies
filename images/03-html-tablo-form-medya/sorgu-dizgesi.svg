  <rect x="363" y="46" width="217" height="36" rx="4" fill="#dafbe1" stroke="#2da44e"/>
  <text x="368" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" textLength="207" lengthAdjust="spacingAndGlyphs">q=%C3%96zhan+HTML%2FCSS</text>
  <rect x="584" y="46" width="19" height="36" rx="4" fill="#eaeef2" stroke="#57606a"/>
  <text x="589" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" textLength="9" lengthAdjust="spacingAndGlyphs">&amp;</text>
  <rect x="607" y="46" width="100" height="36" rx="4" fill="#dafbe1" stroke="#2da44e"/>
  <text x="612" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" textLength="90" lengthAdjust="spacingAndGlyphs">alan=yazar</text>
  <line x1="178" y1="84" x2="178" y2="102" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="178" y="118" text-anchor="middle" fill="#1f6feb">action adresi</text>
  <line x1="350" y1="84" x2="350" y2="134" stroke="#57606a" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" fill="#57606a">ayırıcı</text>
  <line x1="472" y1="84" x2="472" y2="102" stroke="#2da44e" stroke-width="1.5"/>
  <text x="472" y="118" text-anchor="middle" fill="#2da44e">ad=değer çifti</text>
  <line x1="594" y1="84" x2="594" y2="134" stroke="#57606a" stroke-width="1.5"/>
  <text x="594" y="150" text-anchor="middle" fill="#57606a">ayırıcı</text>
  <line x1="657" y1="84" x2="657" y2="102" stroke="#2da44e" stroke-width="1.5"/>
  <text x="657" y="118" text-anchor="middle" fill="#2da44e">ad=değer çifti</text>
  <text x="20" y="190" font-weight="bold">Kodlama (application/x-www-form-urlencoded)</text>
  <text x="40" y="218">boşluk</text>
  <text x="130" y="218" fill="#57606a">→</text>
  <text x="160" y="218" font-family="Consolas, monospace" fill="#cf222e">+</text>
  <text x="250" y="218" fill="#57606a">(genel URL kodlamasında %20)</text>
  <text x="40" y="240">/</text>
  <text x="130" y="240" fill="#57606a">→</text>
  <text x="160" y="240" font-family="Consolas, monospace" fill="#cf222e">%2F</text>
  <text x="250" y="240" fill="#57606a">eğik çizgi</text>
  <text x="40" y="262">@</text>
  <text x="130" y="262" fill="#57606a">→</text>
  <text x="160" y="262" font-family="Consolas, monospace" fill="#cf222e">%40</text>
  <text x="250" y="262" fill="#57606a">e-posta adreslerinde</text>
  <text x="40" y="284">Ö</text>
  <text x="130" y="284" fill="#57606a">→</text>
  <text x="160" y="284" font-family="Consolas, monospace" fill="#cf222e">%C3%96</text>
  <text x="250" y="284" fill="#57606a">UTF-8'de iki bayt</text>
  <text x="40" y="306">&amp;</text>
  <text x="130" y="306" fill="#57606a">→</text>
  <text x="160" y="306" font-family="Consolas, monospace" fill="#cf222e">%26</text>
  <text x="250" y="306" fill="#57606a">değerin içinde geçerse</text>
</svg>
