<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="30" font-weight="bold">GET ile gönderilen formun adresi</text>
  <rect x="20" y="46" width="316" height="36" rx="4" fill="#ddf4ff" stroke="#1f6feb"/>
  <text x="25" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" textLength="306" lengthAdjust="spacingAndGlyphs">https://kutuphane.ornek.edu.tr/ara</text>
  <rect x="340" y="46" width="19" height="36" rx="4" fill="#eaeef2" stroke="#57606a"/>
