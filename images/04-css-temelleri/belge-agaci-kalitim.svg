<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="baslik aciklama">
  <title id="baslik">Belge ağacı ve kalıtım</title>
  <desc id="aciklama">html kökünün altında head ve body bulunur. body altındaki p öğeleri p kuralıyla doğrudan seçilmiştir; p içindeki em öğeleri yazı boyutu ve yazı tipini kalıtır; p içindeki img de değeri kalıtır ancak metin içermediği için görsel bir etki oluşmaz.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Bağlantı çizgileri -->
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="420" y1="54" x2="150" y2="96"/>
    <line x1="420" y1="54" x2="560" y2="96"/>
    <line x1="150" y1="124" x2="70" y2="166"/>
    <line x1="150" y1="124" x2="150" y2="166"/>
    <line x1="150" y1="124" x2="230" y2="166"/>
    <line x1="560" y1="124" x2="310" y2="166"/>
    <line x1="560" y1="124" x2="365" y2="166"/>
    <line x1="560" y1="124" x2="420" y2="166"/>
    <line x1="560" y1="124" x2="475" y2="166"/>
    <line x1="560" y1="124" x2="530" y2="166"/>
    <line x1="560" y1="124" x2="585" y2="166"/>
    <line x1="560" y1="124" x2="640" y2="166"/>
    <line x1="560" y1="124" x2="695" y2="166"/>
    <line x1="560" y1="124" x2="750" y2="166"/>
    <line x1="560" y1="124" x2="805" y2="166"/>
    <line x1="420" y1="194" x2="420" y2="236"/>
    <line x1="530" y1="194" x2="530" y2="236"/>
    <line x1="640" y1="194" x2="615" y2="236"/>
    <line x1="640" y1="194" x2="665" y2="236"/>
  </g>

  <g font-size="14" text-anchor="middle">
    <!-- Kök ve ana dallar -->
    <rect x="390" y="26" width="60" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="420" y="45">html</text>
    <rect x="120" y="96" width="60" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="150" y="115">head</text>
    <rect x="530" y="96" width="60" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="560" y="115">body</text>

    <!-- head çocukları -->
    <rect x="44" y="166" width="52" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="70" y="185">title</text>
    <rect x="124" y="166" width="52" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="150" y="185">style</text>
    <rect x="204" y="166" width="52" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="230" y="185">meta</text>

    <!-- body çocukları -->
    <rect x="290" y="166" width="40" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="310" y="185">h1</text>
    <rect x="345" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="365" y="185">p</text>
    <rect x="400" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="420" y="185">p</text>
    <rect x="455" y="166" width="40" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="475" y="185">h2</text>
    <rect x="510" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="530" y="185">p</text>
    <rect x="565" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="585" y="185">p</text>
    <rect x="620" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="640" y="185">p</text>
    <rect x="675" y="166" width="40" height="28" rx="4" fill="#ffffff" stroke="#24292f"/><text x="695" y="185">h2</text>
    <rect x="730" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="750" y="185">p</text>
    <rect x="785" y="166" width="40" height="28" rx="4" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/><text x="805" y="185">p</text>

    <!-- torunlar -->
    <rect x="398" y="236" width="44" height="28" rx="4" fill="#ffffff" stroke="#2da44e" stroke-width="2" stroke-dasharray="5 3"/><text x="420" y="255">em</text>
    <rect x="506" y="236" width="48" height="28" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="2 3"/><text x="530" y="255" fill="#57606a">img</text>
    <rect x="593" y="236" width="44" height="28" rx="4" fill="#ffffff" stroke="#2da44e" stroke-width="2" stroke-dasharray="5 3"/><text x="615" y="255">em</text>
    <rect x="643" y="236" width="44" height="28" rx="4" fill="#ffffff" stroke="#2da44e" stroke-width="2" stroke-dasharray="5 3"/><text x="665" y="255">em</text>
  </g>

  <!-- Kural -->
  <text x="40" y="250" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#116329">p { font-size: small;</text>
  <text x="40" y="270" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#116329">    font-family: sans-serif; }</text>

  <!-- Açıklama -->
  <g font-size="13" fill="#24292f">
    <rect x="40" y="306" width="22" height="16" rx="3" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
    <text x="72" y="319">Kuralın doğrudan seçtiği öğeler (p)</text>
    <rect x="40" y="332" width="22" height="16" rx="3" fill="#ffffff" stroke="#2da44e" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="72" y="345">Değerleri ebeveynden kalıtan öğeler (em): yazısı da küçük ve sans-serif görünür</text>
    <rect x="40" y="358" width="22" height="16" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="2 3"/>
    <text x="72" y="371">img de değerleri kalıtır; ancak içinde metin olmadığı için yazı tipi özelliklerinin görünür etkisi olmaz</text>
  </g>
</svg>
