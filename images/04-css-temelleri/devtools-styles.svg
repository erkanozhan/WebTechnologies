  <text x="640" y="112" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#24292f">40px</text>
  <text x="536" y="134" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#953800">font-weight</text>
  <text x="640" y="134" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#24292f">700</text>
  <text x="536" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#953800">margin-top</text>
  <text x="640" y="156" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#24292f">8px</text>
