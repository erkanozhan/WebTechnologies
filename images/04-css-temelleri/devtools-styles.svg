<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="baslik aciklama">
  <title id="baslik">Geliştirici araçlarında Styles ve Computed panelleri (temsilî çizim)</title>
  <desc id="aciklama">Styles panelinde seçili p.sicaklik öğesine uygulanan kurallar öncelik sırasıyla listelenir: element.style en üstte, ardından .kart .sicaklik, .sicaklik, p ve tarayıcı varsayılan stili. Kaybeden color bildirimleri üstü çizilidir; geçersiz font-size: 3 em bildirimi uyarı simgesiyle ve üstü çizili gösterilir. Computed panelinde son değerler color rgb(130, 80, 223) ve font-size 40px olarak görünür.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="500" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <rect x="10" y="10" width="780" height="30" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
