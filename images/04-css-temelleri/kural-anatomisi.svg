<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="baslik aciklama">
  <title id="baslik">CSS kuralının anatomisi</title>
  <desc id="aciklama">h1 { color: green; font-size: 2rem; } kuralı parçalarına ayrılmıştır: h1 seçici, küme parantezleri arası bildirim bloğu, her özellik-değer çifti bir bildirim, iki nokta özelliği değerden ayırır, noktalı virgül bildirimleri ayırır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Bildirim bloğu parantezi (üst) -->
  <path d="M104,78 v-10 h556 v10" fill="none" stroke="#2da44e" stroke-width="2"/>
  <text x="382" y="58" text-anchor="middle" font-size="14" fill="#116329" font-weight="bold">Bildirim bloğu (declaration block)</text>

  <!-- Seçici etiketi (üst) -->
  <text x="65" y="58" text-anchor="middle" font-size="14" fill="#0a3069" font-weight="bold">Seçici</text>
  <text x="65" y="76" text-anchor="middle" font-size="13" fill="#0a3069">(selector)</text>
  <line x1="65" y1="82" x2="65" y2="104" stroke="#1f6feb" stroke-width="2"/>

  <!-- Belirteçler -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="20" text-anchor="middle">
    <rect x="40" y="108" width="50" height="40" rx="6" fill="#ddf4ff" stroke="#1f6feb"/>
    <text x="65" y="135" fill="#0a3069">h1</text>
    <rect x="104" y="108" width="30" height="40" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="119" y="135" fill="#116329">{</text>
    <rect x="148" y="108" width="80" height="40" rx="6" fill="#fff8c5" stroke="#bf8700"/>
    <text x="188" y="135" fill="#7d4e00">color</text>
    <rect x="232" y="108" width="20" height="40" rx="4" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="242" y="135" fill="#24292f">:</text>
    <rect x="256" y="108" width="80" height="40" rx="6" fill="#fbefff" stroke="#8250df"/>
    <text x="296" y="135" fill="#512a97">green</text>
    <rect x="340" y="108" width="20" height="40" rx="4" fill="#ffebe9" stroke="#cf222e"/>
    <text x="350" y="135" fill="#a40e26">;</text>
    <rect x="374" y="108" width="120" height="40" rx="6" fill="#fff8c5" stroke="#bf8700"/>
    <text x="434" y="135" fill="#7d4e00">font-size</text>
    <rect x="498" y="108" width="20" height="40" rx="4" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="508" y="135" fill="#24292f">:</text>
    <rect x="522" y="108" width="70" height="40" rx="6" fill="#fbefff" stroke="#8250df"/>
    <text x="557" y="135" fill="#512a97">2rem</text>
    <rect x="596" y="108" width="20" height="40" rx="4" fill="#ffebe9" stroke="#cf222e"/>
    <text x="606" y="135" fill="#a40e26">;</text>
    <rect x="630" y="108" width="30" height="40" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="645" y="135" fill="#116329">}</text>
  </g>

  <!-- Bildirim parantezleri (alt) -->
  <path d="M148,158 v10 h212 v-10" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="254" y="188" text-anchor="middle" font-size="14" fill="#24292f" font-weight="bold">Bildirim (declaration)</text>
  <path d="M374,158 v10 h242 v-10" fill="none" stroke="#57606a" stroke-width="2"/>
  <text x="495" y="188" text-anchor="middle" font-size="14" fill="#24292f" font-weight="bold">Bildirim (declaration)</text>

  <!-- Özellik / değer / noktalı virgül açıklamaları -->
  <line x1="188" y1="200" x2="188" y2="226" stroke="#bf8700" stroke-width="2"/>
  <text x="188" y="244" text-anchor="middle" font-size="14" fill="#7d4e00">Özellik</text>
  <text x="188" y="262" text-anchor="middle" font-size="13" fill="#7d4e00">(property)</text>

  <line x1="296" y1="200" x2="296" y2="226" stroke="#8250df" stroke-width="2"/>
  <text x="296" y="244" text-anchor="middle" font-size="14" fill="#512a97">Değer</text>
  <text x="296" y="262" text-anchor="middle" font-size="13" fill="#512a97">(value)</text>

  <line x1="606" y1="150" x2="606" y2="160" stroke="#cf222e" stroke-width="2"/>
  <line x1="606" y1="200" x2="606" y2="226" stroke="#cf222e" stroke-width="2"/>
  <text x="606" y="244" text-anchor="middle" font-size="14" fill="#a40e26">Noktalı virgül</text>
  <text x="606" y="262" text-anchor="middle" font-size="13" fill="#a40e26">bildirimleri ayırır</text>

  <text x="430" y="244" text-anchor="middle" font-size="14" fill="#24292f">İki nokta: özelliği</text>
  <text x="430" y="262" text-anchor="middle" font-size="13" fill="#24292f">değerden ayırır</text>
</svg>
