<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="baslik aciklama">
  <title id="baslik">Web sayfasının üç katmanı</title>
  <desc id="aciklama">Altta HTML yapı katmanı, ortada CSS sunum katmanı, üstte JavaScript davranış katmanı; her katmanın yanında bir e-ticaret sepet sayfasından örnek kod verilmiştir.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">Bir web sayfasının üç katmanı</text>

  <!-- JS katmanı -->
  <polygon points="60,70 330,70 370,110 100,110" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <text x="215" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#7d4e00">JavaScript — Davranış</text>
  <text x="400" y="84" font-size="14" fill="#24292f">Sayfa ne yapar? (tıklama, hesaplama, veri çekme)</text>
  <text x="400" y="104" font-family="Consolas, monospace" font-size="13" fill="#7d4e00">dugme.addEventListener("click", sepeteEkle);</text>

  <!-- CSS katmanı -->
  <polygon points="60,140 330,140 370,180 100,180" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="215" y="166" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a3069">CSS — Sunum</text>
  <text x="400" y="154" font-size="14" fill="#24292f">Sayfa nasıl görünür? (renk, yazı tipi, yerleşim)</text>
  <text x="400" y="174" font-family="Consolas, monospace" font-size="13" fill="#0a3069">h1 { color: #1f6feb; font-size: 2rem; }</text>

  <!-- HTML katmanı -->
  <polygon points="60,210 330,210 370,250 100,250" fill="#dafbe1" stroke="#2da44e" stroke-width="2"/>
  <text x="215" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#116329">HTML — Yapı ve anlam</text>
  <text x="400" y="224" font-size="14" fill="#24292f">Sayfada ne var? (başlık, liste, form, düğme)</text>
  <text x="400" y="244" font-family="Consolas, monospace" font-size="13" fill="#116329">&lt;h1&gt;Sepetim&lt;/h1&gt; &lt;button&gt;Ekle&lt;/button&gt;</text>

  <!-- ok -->
  <line x1="40" y1="250" x2="40" y2="78" stroke="#57606a" stroke-width="2"/>
  <polygon points="34,82 40,68 46,82" fill="#57606a"/>
  <text x="20" y="285" font-size="13" fill="#57606a">Her katman alttakinin</text>
  <text x="20" y="301" font-size="13" fill="#57606a">üzerine kurulur</text>
  <text x="400" y="290" font-size="13" fill="#57606a">Ayrı dosyalar: index.html · style.css · script.js</text>
</svg>
