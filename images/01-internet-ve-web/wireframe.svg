<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="t d">
  <title id="t">Bir e-ticaret ana sayfasının tel kafes (wireframe) çizimi</title>
  <desc id="d">Üstte logo, giriş bağlantıları ve sepet; altında arama çubuğu ve kategori seçimi. Solda kategori menüsü, sağda dönen kampanya görselleri alanı. Ortada günün fırsatları başlığı altında altı ürün kutusu. En altta kurumsal, sosyal medya ve yardım bağlantılarını içeren alt bilgi. Sağ kenarda bu bölgelerin HTML karşılıkları (header, nav, main, section, footer) gösterilir.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#57606a">
    <rect x="20" y="20" width="640" height="520" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <!-- Üst bilgi -->
    <rect x="36" y="34" width="110" height="44" fill="#d0d7de"/>
    <text x="91" y="61" text-anchor="middle" fill="#24292f">LOGO</text>
    <text x="160" y="72"><tspan text-decoration="underline">Giriş yap</tspan> ya da <tspan text-decoration="underline">Üye ol</tspan></text>
    <text x="645" y="50" text-anchor="end">İletişim | Mağazalar | Yardım | SEPET</text>
    <!-- Arama -->
    <rect x="20" y="90" width="640" height="40" fill="#eaeef2"/>
    <rect x="36" y="99" width="250" height="22" fill="#ffffff" stroke="#8c959f"/>
    <rect x="296" y="99" width="110" height="22" fill="#ffffff" stroke="#8c959f"/>
    <text x="304" y="115" fill="#24292f">Kategori ▾</text>
    <rect x="416" y="99" width="80" height="22" fill="#8c959f"/>
    <text x="456" y="115" text-anchor="middle" fill="#ffffff">ARA</text>
    <!-- Kategori menüsü -->
    <rect x="36" y="142" width="150" height="190" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <g fill="#24292f">
      <text x="46" y="164">Tüm kategoriler</text>
      <text x="46" y="191">Elektronik</text><text x="46" y="218">Giyim</text>
      <text x="46" y="245">Ev ve yaşam</text><text x="46" y="272">Kitap</text>
      <text x="46" y="299">Spor</text><text x="46" y="324">Kozmetik</text>
    </g>
    <g stroke="#d0d7de"><line x1="36" y1="172" x2="186" y2="172"/><line x1="36" y1="199" x2="186" y2="199"/><line x1="36" y1="226" x2="186" y2="226"/><line x1="36" y1="253" x2="186" y2="253"/><line x1="36" y1="280" x2="186" y2="280"/><line x1="36" y1="307" x2="186" y2="307"/></g>
    <!-- Kampanya alanı -->
    <rect x="198" y="142" width="446" height="190" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <text x="421" y="235" text-anchor="middle" fill="#24292f">[ KAMPANYA GÖRSELLERİ DÖNÜŞÜMLÜ GÖSTERİLİR ]</text>
    <g fill="#d0d7de"><rect x="540" y="300" width="20" height="20"/><rect x="566" y="300" width="20" height="20"/><rect x="592" y="300" width="20" height="20"/><rect x="618" y="300" width="20" height="20"/></g>
    <!-- Ürünler -->
    <text x="36" y="362" fill="#24292f" font-weight="bold">Günün Fırsatları</text>
    <g fill="#eaeef2">
      <rect x="40" y="376" width="80" height="70"/><rect x="143" y="376" width="80" height="70"/><rect x="246" y="376" width="80" height="70"/>
      <rect x="349" y="376" width="80" height="70"/><rect x="452" y="376" width="80" height="70"/><rect x="555" y="376" width="80" height="70"/>
    </g>
    <g text-anchor="middle" text-decoration="underline" fill="#24292f" font-size="13">
      <text x="80" y="464">Ürün 1</text><text x="183" y="464">Ürün 2</text><text x="286" y="464">Ürün 3</text>
      <text x="389" y="464">Ürün 4</text><text x="492" y="464">Ürün 5</text><text x="595" y="464">Ürün 6</text>
    </g>
    <!-- Alt bilgi -->
    <line x1="20" y1="476" x2="660" y2="476" stroke="#24292f" stroke-width="2"/>
    <g font-size="13" fill="#24292f">
      <text x="40" y="496" font-weight="bold">KURUMSAL</text><text x="40" y="514">Hakkımızda · Kariyer</text><text x="40" y="530">KVKK · İletişim</text>
      <text x="250" y="496" font-weight="bold">SOSYAL MEDYA</text><text x="250" y="514">Instagram · YouTube</text><text x="250" y="530">Mobil uygulama</text>
      <text x="460" y="496" font-weight="bold">YARDIM</text><text x="460" y="514">S.S.S. · Canlı destek</text><text x="460" y="530">Site haritası</text>
    </g>
    <!-- Anlamsal öğe etiketleri -->
    <g font-family="Consolas, monospace" font-size="14" fill="#1f6feb">
      <path d="M668 34 v96" stroke="#1f6feb" stroke-width="3"/><text x="676" y="80">&lt;header&gt;</text>
      <path d="M668 142 v190" stroke="#2da44e" stroke-width="3"/><text x="676" y="200" fill="#2da44e">&lt;nav&gt; +</text><text x="676" y="218" fill="#2da44e">&lt;aside&gt;</text>
      <path d="M668 345 v124" stroke="#bf8700" stroke-width="3"/><text x="676" y="400" fill="#bf8700">&lt;main&gt;</text><text x="676" y="418" fill="#bf8700">&lt;section&gt;</text>
      <path d="M668 480 v56" stroke="#cf222e" stroke-width="3"/><text x="676" y="512" fill="#cf222e">&lt;footer&gt;</text>
    </g>
  </g>
</svg>
