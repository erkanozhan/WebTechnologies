<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d">
  <title id="t">Temel ağ topolojileri</title>
  <desc id="d">Dört topoloji: yıldız (tüm cihazlar merkezdeki anahtara bağlı), ağaç (yıldızların hiyerarşik bağlanması), örgü (düğümler arasında çok sayıda yedek yol) ve halka (her düğüm iki komşusuna bağlı).</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- a) Yıldız -->
    <g stroke="#8c959f" stroke-width="2">
      <line x1="100" y1="150" x2="100" y2="85"/><line x1="100" y1="150" x2="160" y2="120"/>
      <line x1="100" y1="150" x2="160" y2="185"/><line x1="100" y1="150" x2="100" y2="215"/>
      <line x1="100" y1="150" x2="40" y2="185"/><line x1="100" y1="150" x2="40" y2="120"/>
    </g>
    <rect x="82" y="138" width="36" height="24" rx="4" fill="#57606a"/>
    <g fill="#1f6feb">
      <rect x="88" y="73" width="24" height="18" rx="3"/><rect x="148" y="108" width="24" height="18" rx="3"/>
      <rect x="148" y="176" width="24" height="18" rx="3"/><rect x="88" y="208" width="24" height="18" rx="3"/>
      <rect x="28" y="176" width="24" height="18" rx="3"/><rect x="28" y="108" width="24" height="18" rx="3"/>
    </g>
    <text x="100" y="270" font-size="16" font-weight="bold" fill="#24292f" text-anchor="middle">a) Yıldız</text>
    <text x="100" y="292" font-size="13" fill="#57606a" text-anchor="middle">ev ve ofis ağları</text>

    <!-- b) Ağaç -->
    <g stroke="#8c959f" stroke-width="2">
      <line x1="300" y1="80" x2="250" y2="140"/><line x1="300" y1="80" x2="350" y2="140"/>
      <line x1="250" y1="150" x2="225" y2="205"/><line x1="250" y1="150" x2="275" y2="205"/>
      <line x1="350" y1="150" x2="325" y2="205"/><line x1="350" y1="150" x2="375" y2="205"/>
    </g>
    <rect x="282" y="68" width="36" height="24" rx="4" fill="#57606a"/>
    <rect x="232" y="138" width="36" height="24" rx="4" fill="#57606a"/>
    <rect x="332" y="138" width="36" height="24" rx="4" fill="#57606a"/>
    <g fill="#1f6feb">
      <rect x="213" y="200" width="24" height="18" rx="3"/><rect x="263" y="200" width="24" height="18" rx="3"/>
      <rect x="313" y="200" width="24" height="18" rx="3"/><rect x="363" y="200" width="24" height="18" rx="3"/>
    </g>
    <text x="300" y="270" font-size="16" font-weight="bold" fill="#24292f" text-anchor="middle">b) Ağaç</text>
    <text x="300" y="292" font-size="13" fill="#57606a" text-anchor="middle">kampüs ve kurum ağları</text>

    <!-- c) Örgü -->
    <g stroke="#8c959f" stroke-width="2">
      <line x1="455" y1="95" x2="545" y2="95"/><line x1="455" y1="95" x2="430" y2="170"/>
      <line x1="455" y1="95" x2="500" y2="215"/><line x1="455" y1="95" x2="570" y2="170"/>
      <line x1="545" y1="95" x2="570" y2="170"/><line x1="545" y1="95" x2="430" y2="170"/>
      <line x1="545" y1="95" x2="500" y2="215"/><line x1="430" y1="170" x2="500" y2="215"/>
      <line x1="570" y1="170" x2="500" y2="215"/><line x1="430" y1="170" x2="570" y2="170"/>
    </g>
    <g fill="#57606a">
      <circle cx="455" cy="95" r="14"/><circle cx="545" cy="95" r="14"/>
      <circle cx="430" cy="170" r="14"/><circle cx="570" cy="170" r="14"/><circle cx="500" cy="215" r="14"/>
    </g>
    <text x="500" y="270" font-size="16" font-weight="bold" fill="#24292f" text-anchor="middle">c) Örgü</text>
    <text x="500" y="292" font-size="13" fill="#57606a" text-anchor="middle">İnternet omurgası, yedekli yollar</text>

    <!-- d) Halka -->
    <circle cx="700" cy="150" r="65" fill="none" stroke="#8c959f" stroke-width="2"/>
    <g fill="#1f6feb">
      <rect x="688" y="76" width="24" height="18" rx="3"/><rect x="751" y="110" width="24" height="18" rx="3"/>
      <rect x="751" y="172" width="24" height="18" rx="3"/><rect x="688" y="206" width="24" height="18" rx="3"/>
      <rect x="625" y="172" width="24" height="18" rx="3"/><rect x="625" y="110" width="24" height="18" rx="3"/>
    </g>
    <text x="700" y="270" font-size="16" font-weight="bold" fill="#24292f" text-anchor="middle">d) Halka</text>
    <text x="700" y="292" font-size="13" fill="#57606a" text-anchor="middle">fiber halkalar, eski ağlar</text>

    <g font-size="13" fill="#24292f">
      <rect x="250" y="310" width="16" height="12" rx="2" fill="#1f6feb"/><text x="272" y="321">uç cihaz</text>
      <rect x="350" y="310" width="16" height="12" rx="2" fill="#57606a"/><text x="372" y="321">anahtar / yönlendirici</text>
    </g>
  </g>
</svg>
