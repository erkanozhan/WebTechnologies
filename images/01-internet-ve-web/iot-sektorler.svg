<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">Nesnelerin interneti ve sektörel ağlar</title>
  <desc id="d">Ortada iş dünyası, çevresinde ulaşım, enerji, sağlık, tarım ve çevre, ev, eğitim sektörlerine ait ağlar. Ağlar önce ayrı ayrı kurulur, sonra birbirine bağlanır ve en dışta güvenlik, veri analitiği ve yönetim katmanı ile sarmalanır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="380" y="30" font-size="18" font-weight="bold" fill="#24292f" text-anchor="middle">Nesnelerin interneti: sektörel ağların birleşmesi</text>
    <circle cx="260" cy="225" r="175" fill="#f6f8fa" stroke="#1f6feb" stroke-width="3"/>
    <g stroke="#8c959f" stroke-width="2">
      <line x1="260" y1="225" x2="260" y2="100"/><line x1="260" y1="225" x2="370" y2="165"/>
      <line x1="260" y1="225" x2="370" y2="290"/><line x1="260" y1="225" x2="260" y2="350"/>
      <line x1="260" y1="225" x2="150" y2="290"/><line x1="260" y1="225" x2="150" y2="165"/>
      <line x1="260" y1="100" x2="370" y2="165"/><line x1="370" y1="165" x2="370" y2="290"/>
      <line x1="370" y1="290" x2="260" y2="350"/><line x1="260" y1="350" x2="150" y2="290"/>
      <line x1="150" y1="290" x2="150" y2="165"/><line x1="150" y1="165" x2="260" y2="100"/>
    </g>
    <g font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">
      <circle cx="260" cy="225" r="46" fill="#24292f"/><text x="260" y="230">İş dünyası</text>
      <circle cx="260" cy="100" r="42" fill="#1f6feb"/><text x="260" y="105">Ulaşım</text>
      <circle cx="370" cy="165" r="42" fill="#1f6feb"/><text x="370" y="170">Enerji</text>
      <circle cx="370" cy="290" r="42" fill="#1f6feb"/><text x="370" y="295">Sağlık</text>
      <circle cx="260" cy="350" r="42" fill="#1f6feb"/><text x="260" y="347">Tarım ve</text><text x="260" y="364">çevre</text>
      <circle cx="150" cy="290" r="42" fill="#1f6feb"/><text x="150" y="295">Ev</text>
      <circle cx="150" cy="165" r="42" fill="#1f6feb"/><text x="150" y="170">Eğitim</text>
    </g>
    <g font-size="15" fill="#24292f">
      <text x="470" y="140" font-weight="bold">1. Ayrı ağlar</text>
      <text x="470" y="160" font-size="14" fill="#57606a">akıllı sayaç, araç takip, kampüs ağı</text>
      <line x1="465" y1="135" x2="418" y2="163" stroke="#57606a" stroke-width="1.5"/>
      <text x="470" y="215" font-weight="bold">2. Birbirine bağlanır</text>
      <text x="470" y="235" font-size="14" fill="#57606a">ortak protokol: TCP/IP</text>
      <line x1="465" y1="210" x2="372" y2="228" stroke="#57606a" stroke-width="1.5"/>
      <text x="470" y="290" font-weight="bold">3. Güvenlik, analitik</text>
      <text x="470" y="310" font-weight="bold">ve yönetim</text>
      <text x="470" y="330" font-size="14" fill="#57606a">en dış katman (çember)</text>
      <line x1="465" y1="300" x2="432" y2="310" stroke="#57606a" stroke-width="1.5"/>
    </g>
  </g>
</svg>
