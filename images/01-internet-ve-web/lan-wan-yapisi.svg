<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d">
  <title id="t">Bir yerel ağın (LAN) İnternet'e bağlanması</title>
  <desc id="d">Solda yerel ağ: masaüstü bilgisayarlar ve yazıcı kablolu olarak anahtara, dizüstü ve telefon kablosuz erişim noktasına bağlı. Anahtar, güvenlik duvarı içeren yönlendiriciye; yönlendirici modem/ONT üzerinden İnternet servis sağlayıcısına (ISS), oradan geniş alan ağı olan İnternet'e bağlanır. İnternet'te web sunucuları ve veri merkezleri bulunur.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><circle cx="5" cy="5" r="4" fill="#57606a"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- LAN çerçevesi -->
    <rect x="15" y="40" width="400" height="345" rx="12" fill="#f6f8fa" stroke="#1f6feb" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="30" y="66" font-size="16" font-weight="bold" fill="#1f6feb">Yerel ağ (LAN): ev, ofis, laboratuvar</text>
    <!-- Kablolar -->
    <g stroke="#57606a" stroke-width="2">
      <line x1="95" y1="130" x2="180" y2="215"/>
      <line x1="95" y1="200" x2="180" y2="225"/>
      <line x1="95" y1="275" x2="180" y2="235"/>
      <line x1="240" y1="225" x2="295" y2="225"/>
      <line x1="210" y1="245" x2="210" y2="300"/>
      <line x1="395" y1="225" x2="470" y2="225"/>
      <line x1="560" y1="225" x2="620" y2="225"/>
    </g>
    <g stroke="#bf8700" stroke-width="2" stroke-dasharray="4 4">
      <line x1="210" y1="320" x2="120" y2="345"/>
      <line x1="230" y1="320" x2="320" y2="345"/>
    </g>
    <!-- Cihazlar -->
    <g font-size="13" text-anchor="middle" fill="#24292f">
      <rect x="40" y="110" width="55" height="38" rx="4" fill="#1f6feb"/><text x="67" y="167">PC 1</text>
      <rect x="40" y="180" width="55" height="38" rx="4" fill="#1f6feb"/><text x="67" y="237">PC 2</text>
      <rect x="40" y="255" width="55" height="38" rx="4" fill="#8c959f"/><text x="67" y="312">Ağ yazıcısı</text>
      <rect x="180" y="205" width="60" height="40" rx="4" fill="#57606a"/>
      <text x="210" y="230" fill="#ffffff">Anahtar</text>
      <rect x="180" y="300" width="60" height="22" rx="4" fill="#bf8700"/>
      <text x="210" y="316" fill="#ffffff">Wi-Fi</text>
      <rect x="90" y="335" width="60" height="28" rx="4" fill="#1f6feb"/><text x="120" y="378">Dizüstü</text>
      <rect x="310" y="333" width="22" height="32" rx="4" fill="#1f6feb"/><text x="321" y="378">Telefon</text>
      <rect x="295" y="205" width="100" height="40" rx="4" fill="#cf222e"/>
      <text x="345" y="230" fill="#ffffff">Yönlendirici</text>
      <text x="345" y="266">güvenlik duvarı,</text>
      <text x="345" y="282">NAT, DHCP</text>
      <rect x="470" y="200" width="90" height="50" rx="4" fill="#57606a"/>
      <text x="515" y="222" fill="#ffffff">Modem /</text>
      <text x="515" y="238" fill="#ffffff">ONT</text>
      <text x="515" y="270">fiber, VDSL, 5G</text>
    </g>
    <!-- ISS ve İnternet -->
    <rect x="620" y="195" width="70" height="60" rx="6" fill="#2da44e"/>
    <text x="655" y="231" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ISS</text>
    <path d="M640 120 C600 120 600 70 645 75 C655 40 715 40 725 70 C770 60 790 110 750 120 Z" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="695" y="103" font-size="15" font-weight="bold" fill="#24292f" text-anchor="middle">İnternet (WAN)</text>
    <line x1="655" y1="195" x2="680" y2="122" stroke="#57606a" stroke-width="2"/>
    <rect x="700" y="290" width="80" height="80" rx="6" fill="#24292f"/>
    <g fill="#57606a"><rect x="710" y="300" width="60" height="14" rx="2"/><rect x="710" y="320" width="60" height="14" rx="2"/><rect x="710" y="340" width="60" height="14" rx="2"/></g>
    <text x="740" y="388" font-size="13" fill="#24292f" text-anchor="middle">Web sunucuları</text>
    <line x1="740" y1="290" x2="740" y2="122" stroke="#57606a" stroke-width="2"/>
    <text x="400" y="26" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Yerel ağdan geniş alan ağına</text>
  </g>
</svg>
