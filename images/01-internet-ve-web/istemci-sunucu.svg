<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">İstemci–sunucu modeli ve istek–yanıt döngüsü</title>
  <desc id="d">Solda tarayıcı çalıştıran istemci, sağda web sunucusu. İstemci URL ile belirtilen kaynağı HTTP isteğiyle ister; sunucu durum kodu ve HTML içeren bir HTTP yanıtı döndürür.</desc>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6feb"/></marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2da44e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- İstemci -->
    <rect x="40" y="80" width="150" height="100" rx="8" fill="#f6f8fa" stroke="#1f6feb" stroke-width="3"/>
    <rect x="40" y="80" width="150" height="20" rx="8" fill="#1f6feb"/>
    <circle cx="54" cy="90" r="4" fill="#ffffff"/><circle cx="66" cy="90" r="4" fill="#ffffff"/>
    <rect x="55" y="112" width="120" height="10" rx="3" fill="#8c959f"/>
    <rect x="55" y="130" width="90" height="8" rx="3" fill="#d0d7de"/>
    <rect x="55" y="145" width="105" height="8" rx="3" fill="#d0d7de"/>
    <rect x="55" y="160" width="70" height="8" rx="3" fill="#d0d7de"/>
    <rect x="95" y="180" width="40" height="14" fill="#57606a"/>
    <rect x="65" y="194" width="100" height="8" rx="3" fill="#57606a"/>
    <text x="115" y="232" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">İstemci</text>
    <text x="115" y="254" font-size="14" fill="#57606a" text-anchor="middle">tarayıcı (bilgisayar, telefon)</text>

    <!-- Sunucu -->
    <rect x="550" y="60" width="110" height="150" rx="6" fill="#24292f"/>
    <g fill="#57606a"><rect x="565" y="78" width="80" height="22" rx="3"/><rect x="565" y="110" width="80" height="22" rx="3"/><rect x="565" y="142" width="80" height="22" rx="3"/></g>
    <g fill="#2da44e"><circle cx="575" cy="89" r="4"/><circle cx="575" cy="121" r="4"/><circle cx="575" cy="153" r="4"/></g>
    <circle cx="575" cy="188" r="5" fill="#bf8700"/>
    <text x="605" y="232" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Sunucu</text>
    <text x="605" y="254" font-size="14" fill="#57606a" text-anchor="middle">web sunucusu yazılımı</text>

    <!-- Oklar -->
    <line x1="205" y1="110" x2="535" y2="110" stroke="#1f6feb" stroke-width="4" marker-end="url(#ma)"/>
    <text x="370" y="85" font-size="15" font-weight="bold" fill="#1f6feb" text-anchor="middle">1. HTTP isteği (request)</text>
    <text x="370" y="102" font-size="13" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">GET /index.html HTTP/1.1</text>

    <line x1="535" y1="165" x2="205" y2="165" stroke="#2da44e" stroke-width="4" marker-end="url(#my)"/>
    <text x="370" y="190" font-size="15" font-weight="bold" fill="#2da44e" text-anchor="middle">2. HTTP yanıtı (response)</text>
    <text x="370" y="208" font-size="13" fill="#24292f" text-anchor="middle" font-family="Consolas, monospace">HTTP/1.1 200 OK + HTML belgesi</text>

    <text x="360" y="300" font-size="14" fill="#57606a" text-anchor="middle">URL kaynağın adresini, HTTP konuşmanın kurallarını, HTML ise gelen belgenin yapısını belirler.</text>
  </g>
</svg>
