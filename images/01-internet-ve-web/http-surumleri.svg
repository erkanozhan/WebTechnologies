<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d">
  <title id="t">HTTP/1.1, HTTP/2 ve HTTP/3 protokol yığınları</title>
  <desc id="d">HTTP/1.1 metin tabanlıdır ve TCP üzerinde çalışır; HTTPS için araya TLS girer. HTTP/2 ikili çerçeveleme ve çoğullama getirir, uygulamada TLS ve TCP üzerinde çalışır. HTTP/3 ise UDP üzerinde çalışan ve TLS 1.3'ü içinde barındıran QUIC protokolünü kullanır. Hepsi en altta IP üzerinde çalışır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="390" y="30" font-size="18" font-weight="bold" fill="#24292f">HTTP sürümlerinin protokol yığınları</text>
    <!-- HTTP/1.1 -->
    <text x="140" y="65" font-weight="bold" fill="#24292f">HTTP/1.1 (1997)</text>
    <rect x="50" y="80" width="180" height="40" rx="5" fill="#1f6feb"/><text x="140" y="105" fill="#ffffff">HTTP/1.1 (metin)</text>
    <rect x="50" y="124" width="180" height="40" rx="5" fill="#ddf4ff" stroke="#1f6feb" stroke-dasharray="5 4"/><text x="140" y="149" fill="#24292f">TLS (HTTPS ise)</text>
    <rect x="50" y="168" width="180" height="40" rx="5" fill="#2da44e"/><text x="140" y="193" fill="#ffffff">TCP</text>
    <!-- HTTP/2 -->
    <text x="390" y="65" font-weight="bold" fill="#24292f">HTTP/2 (2015)</text>
    <rect x="300" y="80" width="180" height="40" rx="5" fill="#1f6feb"/><text x="390" y="105" fill="#ffffff">HTTP/2 (ikili, çoğullama)</text>
    <rect x="300" y="124" width="180" height="40" rx="5" fill="#ddf4ff" stroke="#1f6feb"/><text x="390" y="149" fill="#24292f">TLS</text>
    <rect x="300" y="168" width="180" height="40" rx="5" fill="#2da44e"/><text x="390" y="193" fill="#ffffff">TCP</text>
    <!-- HTTP/3 -->
    <text x="640" y="65" font-weight="bold" fill="#24292f">HTTP/3 (2022)</text>
    <rect x="550" y="80" width="180" height="40" rx="5" fill="#1f6feb"/><text x="640" y="105" fill="#ffffff">HTTP/3</text>
    <rect x="550" y="124" width="180" height="40" rx="5" fill="#8250df"/><text x="640" y="149" fill="#ffffff">QUIC + TLS 1.3</text>
    <rect x="550" y="168" width="180" height="40" rx="5" fill="#bf8700"/><text x="640" y="193" fill="#ffffff">UDP</text>
    <!-- IP -->
    <rect x="50" y="216" width="680" height="40" rx="5" fill="#57606a"/><text x="390" y="241" fill="#ffffff">IP (IPv4 / IPv6)</text>
    <g font-size="13" fill="#57606a">
      <text x="140" y="285">bağlantı başına</text>
      <text x="140" y="302">tek seferde bir istek</text>
      <text x="390" y="285">tek bağlantıda çok sayıda</text>
      <text x="390" y="302">eş zamanlı akış</text>
      <text x="640" y="285">kayıp paket diğer akışları</text>
      <text x="640" y="302">bekletmez, hızlı bağlantı kurulumu</text>
    </g>
  </g>
</svg>
