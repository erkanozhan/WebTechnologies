<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d">
  <title id="t">Paket anahtarlama</title>
  <desc id="d">Bir mesaj üç pakete bölünür; paketler beş yönlendiriciden oluşan ağda farklı rotalar izleyerek hedefe ulaşır ve hedefte yeniden sıralanır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Bağlantılar -->
    <g stroke="#8c959f" stroke-width="2">
      <line x1="120" y1="190" x2="215" y2="110"/>
      <line x1="120" y1="210" x2="215" y2="290"/>
      <line x1="255" y1="100" x2="505" y2="100"/>
      <line x1="250" y1="120" x2="360" y2="185"/>
      <line x1="255" y1="300" x2="505" y2="300"/>
      <line x1="250" y1="280" x2="360" y2="215"/>
      <line x1="400" y1="185" x2="510" y2="120"/>
      <line x1="400" y1="215" x2="510" y2="280"/>
      <line x1="545" y1="110" x2="640" y2="190"/>
      <line x1="545" y1="290" x2="640" y2="210"/>
    </g>
    <!-- Kaynak ve hedef -->
    <rect x="20" y="170" width="100" height="60" rx="8" fill="#1f6feb"/>
    <text x="70" y="206" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Kaynak</text>
    <rect x="640" y="170" width="100" height="60" rx="8" fill="#2da44e"/>
    <text x="690" y="206" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Hedef</text>
    <!-- Yönlendiriciler -->
    <g fill="#57606a">
      <circle cx="235" cy="100" r="26"/>
      <circle cx="235" cy="300" r="26"/>
      <circle cx="380" cy="200" r="26"/>
      <circle cx="525" cy="100" r="26"/>
      <circle cx="525" cy="300" r="26"/>
    </g>
    <g font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="235" y="105">R1</text>
      <text x="235" y="305">R2</text>
      <text x="380" y="205">R3</text>
      <text x="525" y="105">R4</text>
      <text x="525" y="305">R5</text>
    </g>
    <!-- Paketler -->
    <g font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <rect x="150" y="128" width="24" height="24" rx="3" fill="#1f6feb"/><text x="162" y="145">1</text>
      <rect x="370" y="80" width="24" height="24" rx="3" fill="#1f6feb"/><text x="382" y="97">1</text>
      <rect x="590" y="128" width="24" height="24" rx="3" fill="#1f6feb"/><text x="602" y="145">1</text>

      <rect x="290" y="130" width="24" height="24" rx="3" fill="#bf8700"/><text x="302" y="147">2</text>
      <rect x="445" y="232" width="24" height="24" rx="3" fill="#bf8700"/><text x="457" y="249">2</text>

      <rect x="150" y="246" width="24" height="24" rx="3" fill="#cf222e"/><text x="162" y="263">3</text>
      <rect x="370" y="306" width="24" height="24" rx="3" fill="#cf222e"/><text x="382" y="323">3</text>
      <rect x="590" y="246" width="24" height="24" rx="3" fill="#cf222e"/><text x="602" y="263">3</text>
    </g>
    <!-- Açıklama -->
    <g font-size="14" fill="#24292f">
      <rect x="20" y="350" width="16" height="16" rx="3" fill="#1f6feb"/>
      <text x="44" y="363">Paket 1: Kaynak → R1 → R4 → Hedef</text>
      <rect x="290" y="350" width="16" height="16" rx="3" fill="#bf8700"/>
      <text x="314" y="363">Paket 2: Kaynak → R1 → R3 → R5 → Hedef</text>
      <rect x="20" y="380" width="16" height="16" rx="3" fill="#cf222e"/>
      <text x="44" y="393">Paket 3: Kaynak → R2 → R5 → Hedef</text>
      <text x="314" y="393">Hedefte paketler sıra numarasına göre birleştirilir.</text>
    </g>
    <text x="380" y="36" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Paket anahtarlama: her paket kendi rotasını izleyebilir</text>
  </g>
</svg>
