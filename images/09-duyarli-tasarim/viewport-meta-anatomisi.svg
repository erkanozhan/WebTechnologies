<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">viewport meta etiketinin parçaları</title>
  <desc id="d">name niteliği viewport değerini alır; content içindeki width eşittir device-width düzen genişliğini cihaz genişliğine eşitler; initial-scale eşittir 1 ilk yakınlaştırma düzeyini yüzde yüz yapar.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="20" y="40" width="760" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="36" y="76" font-size="19" font-family="Consolas, monospace" fill="#24292f">&lt;meta <tspan fill="#8250df">name</tspan>="<tspan fill="#1f6feb">viewport</tspan>" <tspan fill="#8250df">content</tspan>="<tspan fill="#2da44e">width=device-width</tspan>, <tspan fill="#bf8700">initial-scale=1</tspan>"&gt;</text>
  <line x1="200" y1="100" x2="120" y2="150" stroke="#1f6feb" stroke-width="2"/>
  <line x1="490" y1="100" x2="420" y2="150" stroke="#2da44e" stroke-width="2"/>
  <line x1="690" y1="100" x2="680" y2="150" stroke="#bf8700" stroke-width="2"/>
  <g font-size="14">
    <text x="20" y="172" fill="#1f6feb" font-weight="bold">name="viewport"</text>
    <text x="20" y="194" fill="#24292f">Bu meta öğesinin görünüm</text>
    <text x="20" y="214" fill="#24292f">alanı ayarı olduğunu bildirir.</text>
    <text x="300" y="172" fill="#2da44e" font-weight="bold">width=device-width</text>
    <text x="300" y="194" fill="#24292f">Düzen genişliği = cihazın CSS piksel</text>
    <text x="300" y="214" fill="#24292f">genişliği (ör. 390 px); 980 px varsayımı</text>
    <text x="300" y="234" fill="#24292f">devre dışı kalır.</text>
    <text x="600" y="172" fill="#bf8700" font-weight="bold">initial-scale=1</text>
    <text x="600" y="194" fill="#24292f">Sayfa ilk açıldığında</text>
    <text x="600" y="214" fill="#24292f">yakınlaştırma %100 olur.</text>
  </g>
  <text x="20" y="26" font-size="14" fill="#57606a">&lt;head&gt; içinde, her sayfada bir kez</text>
</svg>
