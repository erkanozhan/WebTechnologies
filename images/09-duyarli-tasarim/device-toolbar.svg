<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Device Toolbar (cihaz modu) şeması</title>
  <desc id="d">Cihaz modunda sayfanın üstünde bir araç çubuğu bulunur: Boyutlar menüsü (Responsive veya bir cihaz adı), genişlik ve yükseklik kutuları, yakınlaştırma, cihaz piksel oranı, ağ yavaşlatma menüsü ve döndürme düğmesi. Altında medya sorgusu çubuğu ve sürükleme tutamaçlı görünüm alanı yer alır.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="10" y="10" width="800" height="450" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <!-- toolbar -->
  <rect x="20" y="20" width="780" height="40" rx="6" fill="#eaeef2" stroke="#d0d7de"/>
  <g font-size="13" fill="#24292f">
    <rect x="30" y="28" width="170" height="24" rx="4" fill="#ffffff" stroke="#57606a"/>
    <text x="38" y="45">Dimensions: Responsive ▾</text>
    <rect x="210" y="28" width="56" height="24" rx="4" fill="#ffffff" stroke="#57606a"/><text x="222" y="45">390</text>
    <text x="272" y="45">×</text>
    <rect x="284" y="28" width="56" height="24" rx="4" fill="#ffffff" stroke="#57606a"/><text x="296" y="45">844</text>
    <text x="352" y="45">100% ▾</text>
    <text x="414" y="45">DPR: 3.0 ▾</text>
    <rect x="494" y="28" width="150" height="24" rx="4" fill="#ffffff" stroke="#57606a"/>
    <text x="502" y="45">No throttling ▾</text>
    <text x="660" y="46" font-size="18">⟳</text>
    <text x="690" y="45" font-size="12" fill="#57606a">(döndür)</text>
    <text x="770" y="45" font-size="18">⋮</text>
  </g>
  <!-- media query bar -->
  <rect x="180" y="72" width="460" height="10" fill="#c3d08b"/>
  <rect x="250" y="84" width="320" height="10" fill="#9cc2e6"/>
  <rect x="320" y="96" width="180" height="10" fill="#f9cc9d"/>
  <text x="650" y="92" font-size="12" fill="#57606a">medya sorgusu çubukları</text>
  <text x="650" y="107" font-size="12" fill="#57606a">(Show media queries)</text>
  <!-- viewport -->
  <rect x="325" y="118" width="170" height="320" rx="14" fill="#24292f"/>
  <rect x="333" y="126" width="154" height="304" fill="#ffffff"/>
  <rect x="333" y="126" width="154" height="30" fill="#0a3069"/>
  <rect x="343" y="166" width="134" height="60" fill="#ddf4ff"/>
  <rect x="343" y="234" width="134" height="60" fill="#ddf4ff"/>
  <rect x="343" y="302" width="134" height="60" fill="#ddf4ff"/>
  <rect x="500" y="250" width="8" height="50" rx="3" fill="#8c959f"/>
  <rect x="385" y="442" width="50" height="8" rx="3" fill="#8c959f"/>
  <!-- callouts -->
  <g font-size="13" fill="#24292f">
    <line x1="80" y1="60" x2="80" y2="140" stroke="#1f6feb" stroke-width="2"/>
    <text x="30" y="160" font-weight="bold" fill="#1f6feb">Cihaz listesi</text>
    <text x="30" y="178">Responsive veya hazır</text>
    <text x="30" y="196">cihaz (telefon, tablet);</text>
    <text x="30" y="214">Edit… ile yeni cihaz eklenir.</text>
    <line x1="560" y1="60" x2="600" y2="200" stroke="#cf222e" stroke-width="2"/>
    <text x="560" y="220" font-weight="bold" fill="#cf222e">Ağ yavaşlatma</text>
    <text x="560" y="238">Hızlı / yavaş mobil ağ,</text>
    <text x="560" y="256">Offline (adlar sürüme göre değişir)</text>
    <line x1="510" y1="275" x2="560" y2="320" stroke="#2da44e" stroke-width="2"/>
    <text x="560" y="336" font-weight="bold" fill="#2da44e">Sürükleme tutamacı</text>
    <text x="560" y="354">Responsive modda genişlik</text>
    <text x="560" y="372">ve yükseklik elle değişir.</text>
    <text x="30" y="300" font-weight="bold" fill="#bf8700">DPR</text>
    <text x="30" y="318">Cihaz piksel oranı;</text>
    <text x="30" y="336">srcset seçimini etkiler.</text>
  </g>
</svg>
