<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Chrome DevTools ana panelleri (şematik)</title>
  <desc id="d">Tarayıcı penceresinin solunda sayfa, sağında DevTools paneli yer alır. Üstte inceleme ve cihaz araç çubuğu simgeleri ile Elements, Console, Sources, Network, Application ve Lighthouse sekmeleri bulunur. Elements sekmesinde solda DOM ağacı, sağda Styles ve kutu modeli bölmesi görünür.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- browser frame -->
  <rect x="10" y="10" width="800" height="420" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <rect x="10" y="10" width="800" height="36" rx="10" fill="#d0d7de"/>
  <circle cx="32" cy="28" r="6" fill="#cf222e"/><circle cx="52" cy="28" r="6" fill="#bf8700"/><circle cx="72" cy="28" r="6" fill="#2da44e"/>
  <rect x="100" y="18" width="300" height="20" rx="10" fill="#ffffff"/>
  <text x="112" y="33" font-size="12" fill="#57606a">file:///.../index.html</text>
  <!-- page -->
  <rect x="20" y="56" width="300" height="364" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="20" y="56" width="300" height="40" fill="#0a3069"/>
  <text x="34" y="81" font-size="14" fill="#ffffff">Sayfa</text>
  <rect x="40" y="116" width="260" height="70" fill="#ddf4ff" stroke="#1f6feb" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="50" y="140" font-size="12" fill="#0a3069">seçili öğe vurgulanır</text>
  <text x="50" y="158" font-size="12" fill="#0a3069">(margin turuncu, padding yeşil)</text>
  <rect x="40" y="200" width="260" height="14" fill="#eaeef2"/><rect x="40" y="222" width="220" height="14" fill="#eaeef2"/><rect x="40" y="244" width="240" height="14" fill="#eaeef2"/>
  <!-- devtools -->
  <rect x="330" y="56" width="470" height="364" fill="#ffffff" stroke="#57606a"/>
  <rect x="330" y="56" width="470" height="32" fill="#eaeef2"/>
  <rect x="338" y="62" width="22" height="20" rx="3" fill="#ffffff" stroke="#57606a"/>
  <path d="M343 67 l6 12 l2 -5 l5 -2 z" fill="#57606a"/>
  <rect x="366" y="62" width="22" height="20" rx="3" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/>
  <rect x="371" y="65" width="8" height="14" rx="2" fill="none" stroke="#24292f" stroke-width="1.5"/><rect x="380" y="69" width="5" height="10" rx="1" fill="none" stroke="#24292f" stroke-width="1.5"/>
  <g font-size="12" fill="#24292f">
    <text x="398" y="77" font-weight="bold" fill="#1f6feb">Elements</text>
    <text x="460" y="77">Console</text>
    <text x="514" y="77">Sources</text>
    <text x="568" y="77">Network</text>
    <text x="624" y="77">Application</text>
    <text x="696" y="77">Lighthouse</text>
  </g>
  <line x1="396" y1="87" x2="452" y2="87" stroke="#1f6feb" stroke-width="3"/>
  <!-- DOM tree -->
  <g font-size="12" font-family="Consolas, monospace" fill="#8250df">
    <text x="342" y="112">&lt;html lang="tr"&gt;</text>
    <text x="352" y="130">▸ &lt;head&gt;…&lt;/head&gt;</text>
    <text x="352" y="148">▾ &lt;body&gt;</text>
    <text x="364" y="166">&lt;header&gt;…&lt;/header&gt;</text>
    <rect x="360" y="173" width="190" height="18" fill="#ddf4ff"/>
    <text x="364" y="186">&lt;main class="kart"&gt;</text>
    <text x="364" y="204">&lt;footer&gt;…&lt;/footer&gt;</text>
  </g>
  <text x="342" y="240" font-size="12" fill="#57606a">DOM ağacı: düzenlenebilir,</text>
  <text x="342" y="256" font-size="12" fill="#57606a">sürükle-bırak yapılabilir</text>
  <!-- styles pane -->
  <line x1="560" y1="88" x2="560" y2="420" stroke="#d0d7de"/>
  <text x="570" y="108" font-size="12" font-weight="bold" fill="#24292f">Styles | Computed</text>
  <g font-size="12" font-family="Consolas, monospace" fill="#24292f">
    <text x="570" y="130">.kart {</text>
    <text x="582" y="148"><tspan fill="#cf222e">padding</tspan>: 16px;</text>
    <text x="582" y="166"><tspan fill="#cf222e">border</tspan>: 4px solid;</text>
    <text x="582" y="184" text-decoration="line-through" fill="#8c959f">color: red;</text>
    <text x="570" y="202">}</text>
  </g>
  <rect x="580" y="222" width="200" height="110" fill="#f9cc9d"/>
  <rect x="596" y="236" width="168" height="82" fill="#fddd9b" stroke="#24292f"/>
  <rect x="608" y="246" width="144" height="62" fill="#c3d08b"/>
  <rect x="624" y="258" width="112" height="38" fill="#8cb6c0"/>
  <text x="680" y="282" font-size="12" text-anchor="middle" fill="#24292f">260 × 71</text>
  <text x="570" y="356" font-size="12" fill="#57606a">Üstü çizili kural: basamaklamada</text>
  <text x="570" y="372" font-size="12" fill="#57606a">ezilmiş bildirim</text>
  <!-- callout -->
  <line x1="377" y1="62" x2="377" y2="48" stroke="#bf8700" stroke-width="2"/>
  <text x="384" y="52" font-size="12" fill="#7d4e00" font-weight="bold">Device Toolbar (Ctrl+Shift+M)</text>
</svg>
